<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אבני הקסם">
<meta name="theme-color" content="#2b1055">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b1055">
<title>גיבור אבני הקסם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1055;
  --fs:clamp(14px,calc(1.1vmin + 9px),22px);
  --ol:3px 3px 0 #2b1055,-3px 3px 0 #2b1055,3px -3px 0 #2b1055,-3px -3px 0 #2b1055,0 3px 0 #2b1055,0 -3px 0 #2b1055,3px 0 0 #2b1055,-3px 0 0 #2b1055;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b0b3a}
body{font-family:'Rubik','Arial Hebrew','Segoe UI',Arial,sans-serif;font-size:var(--fs);color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-appearance:none;appearance:none}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:-5%;background:linear-gradient(135deg,#7209b7,#f72585 45%,#ff9e00 80%,#4cc9f0);background-size:300% 300%;animation:bgm 22s ease-in-out infinite;transition:background .6s}
#bg::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.6px,transparent 1.8px);background-size:20px 20px}
@keyframes bgm{0%,100%{background-position:0% 40%}50%{background-position:100% 60%}}
#deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#deco span{position:absolute;opacity:.22;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(-10deg)}100%{transform:translate(4vw,-6vh) rotate(12deg)}}
#screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
#screen.shk{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}
#modal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,5,50,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:2vmin}
#modal.show{display:flex}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:85}
#fly{position:absolute;inset:0;pointer-events:none;z-index:86;overflow:hidden}
#toast{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;z-index:90;transform:translate(-50%,-160%);background:linear-gradient(90deg,#ff006e,#ff9f1c);border:4px solid var(--ink);border-radius:20px;padding:10px 20px;font-weight:900;font-size:1.15em;box-shadow:0 6px 0 var(--ink);transition:transform .35s cubic-bezier(.2,1.6,.4,1);text-align:center;max-width:92vw;pointer-events:none}
#toast.on{transform:translate(-50%,0)}

/* generic */
.card{position:relative;background:linear-gradient(170deg,#fff,#f3eaff);color:var(--ink);border-radius:30px;border:5px solid var(--ink);box-shadow:0 10px 0 var(--ink),0 24px 50px rgba(0,0,0,.4);padding:clamp(14px,3vmin,26px);max-width:min(94vw,760px);width:100%;max-height:94%;overflow:auto;animation:pop .38s cubic-bezier(.2,1.6,.4,1)}
.card.comic{background:radial-gradient(rgba(255,190,11,.18) 1.5px,transparent 1.7px) 0 0/14px 14px,linear-gradient(170deg,#fff,#fff3d6)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.btn{font-weight:800;font-size:1.15em;border:4px solid var(--ink);border-radius:20px;padding:.5em 1.15em;color:#fff;background:linear-gradient(180deg,#ff8a00,#e52e71);box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:.35em;line-height:1.2}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:1.45em;padding:.55em 1.4em}
.btn.sm{font-size:.92em;padding:.38em .9em;box-shadow:0 4px 0 var(--ink)}
.btn.green{background:linear-gradient(180deg,#6af58a,#16a34a)}
.btn.blue{background:linear-gradient(180deg,#5ec8ff,#2563eb)}
.btn.purple{background:linear-gradient(180deg,#c77dff,#7b2cbf)}
.btn.gray{background:linear-gradient(180deg,#b8b8d1,#6c6c8a)}
.btn.red{background:linear-gradient(180deg,#ff6b8b,#d00045)}
.btn.gold{background:linear-gradient(180deg,#ffe66d,#ff9f1c);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.5)}
.btn[disabled]{filter:grayscale(1);opacity:.55;pointer-events:none}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mh{font-weight:900;font-size:1.65em;text-align:center;margin-bottom:12px}
.mp{text-align:center;font-size:1.15em;margin-bottom:6px}
.lbl{display:block;font-weight:800;margin:12px 0 6px}
.inp{width:100%;font-size:1.4em;padding:.45em .7em;border:4px solid var(--ink);border-radius:16px;font-weight:700;color:var(--ink);background:#fff;outline:none;text-align:center}
.inp.err{animation:shake .4s;border-color:#e11d48}
.iconbtn{width:clamp(44px,7vmin,58px);height:clamp(44px,7vmin,58px);border-radius:16px;border:3px solid var(--ink);background:linear-gradient(180deg,#fff,#e9d5ff);box-shadow:0 4px 0 var(--ink);font-size:1.35em;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.96);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:900;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.pill.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
.pill small{font-size:.7em;opacity:.7}
.sbar{display:inline-block;width:42px;height:10px;border-radius:6px;background:#ffd6e0;border:2px solid var(--ink);overflow:hidden;vertical-align:middle}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ff8fab)}
.coin{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbd0 0,#ffd60a 42%,#d99000 100%);border:2px solid #7a4d00;vertical-align:middle;position:relative;flex:none}
.coin::after{content:'★';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.62em;color:#9a6200;line-height:1}
.coin.sm{width:.95em;height:.95em}
.av{display:inline-block;border-radius:50%;border:3px solid var(--ink);background-size:cover;background-position:center;background-color:#ffd2a8;flex:none;overflow:hidden;box-shadow:inset 0 0 0 3px #ffd60a;vertical-align:middle}
.av svg{display:block}
.stars{white-space:nowrap}
.stars b{color:rgba(255,255,255,.5);text-shadow:0 2px 0 var(--ink);font-size:1.15em}
.stars b.on{color:#ffd60a}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.04)}}

/* title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:3vmin;text-align:center;position:relative}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:45%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.13) 0 9deg,transparent 9deg 18deg);animation:spin 50s linear infinite;pointer-events:none}
.logo{position:relative;font-weight:900;font-size:clamp(40px,10vmin,104px);line-height:1;background:linear-gradient(180deg,#fff 0%,#fff36b 40%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:3px var(--ink);filter:drop-shadow(0 7px 0 var(--ink)) drop-shadow(0 14px 18px rgba(0,0,0,.35));transform:rotate(-3deg);animation:logoIn .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes logoIn{from{transform:rotate(-12deg) scale(.3);opacity:0}}
.heroTitle{position:relative;height:min(40vh,56vw);aspect-ratio:200/270;animation:heroIdle 2s ease-in-out infinite}
.heroTitle svg,.sHero svg,.shopHero svg{width:100%;height:100%;overflow:visible}
.orbit{position:absolute;left:78%;top:70%;width:0;height:0}
.ostone{position:absolute;left:0;top:0;width:clamp(36px,6.5vmin,56px);height:clamp(32px,5.8vmin,50px);border-radius:48% 52% 45% 55%/55% 48% 52% 45%;background:radial-gradient(circle at 35% 30%,#fff 0 9%,var(--c1) 35%,var(--c2));border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink);box-shadow:0 0 18px var(--c1);animation:orbit 4.2s linear infinite;animation-delay:calc(var(--i) * -1.4s)}
@keyframes orbit{from{transform:translate(-50%,-50%) rotate(0deg) translateX(clamp(56px,11vmin,100px)) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg) translateX(clamp(56px,11vmin,100px)) rotate(-360deg)}}
.sub{font-weight:800;font-size:1.2em;text-shadow:var(--ol);position:relative}
.title .btn{position:relative;animation:pulse 1.4s ease-in-out infinite}

/* header / topbar */
.pageHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.h1{font-weight:900;font-size:clamp(28px,6vmin,54px);text-shadow:var(--ol),0 6px 0 var(--ink)}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(43,16,85,.78),rgba(43,16,85,.3));flex-wrap:wrap;position:relative;z-index:5}
.tbSp{flex:1}
.pbadge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border:3px solid var(--ink);border-radius:999px;padding-block:3px;padding-inline:3px 14px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 var(--ink);font-size:1em}

/* profiles */
.profiles{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:3vmin;justify-content:center;align-content:center;padding:3vmin}
.pcard{width:clamp(150px,26vmin,220px);padding:16px 10px;border-radius:28px;border:5px solid var(--ink);background:linear-gradient(170deg,#fff,#f3e8ff);box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);animation:pop .4s backwards}
.pcard:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.pcard .pname{font-weight:900;font-size:1.3em}
.pcard .pstats{font-weight:700;display:flex;gap:10px;align-items:center}
.pcard.new{background:linear-gradient(170deg,#fffbe6,#ffe08a)}
.plus{font-size:4.2em;line-height:1;font-weight:900;color:#f77f00}
.facePick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fp{background:#fff;border:4px solid #d8c8ff;border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:var(--ink);width:clamp(110px,22vmin,150px)}
.fp.on{border-color:#22c55e;background:#e9ffe9;box-shadow:0 0 0 4px rgba(34,197,94,.35)}
.fp .av{width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:2em}

/* story */
.story{text-align:center}
.panelArt{height:min(34vh,260px);display:flex;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle,#fff6c2,#ffc8ef);border:4px solid var(--ink);border-radius:22px;margin-bottom:12px;overflow:hidden;position:relative}
.sEmoji{font-size:clamp(70px,15vmin,130px);animation:pulse 1.6s infinite}
.sHero{height:92%;aspect-ratio:200/270}
.sStones{display:flex;gap:4vmin}
.sStones .stone{animation:stoneBob 2s ease-in-out infinite}
.sText{font-size:clamp(20px,3.6vmin,30px);font-weight:700;line-height:1.55}
.dots{margin-top:10px}
.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#d8c8ff;margin:0 4px}
.dots i.on{background:#7b2cbf}

/* map */
.mapScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:3vmin 3vw 10vmin;position:relative}
.daily{display:flex;align-items:center;gap:10px;margin:0 auto 3vmin;font-size:1.3em;font-weight:900;padding:10px 24px;border-radius:999px;border:4px solid var(--ink);background:linear-gradient(90deg,#ff006e,#ffbe0b);color:#fff;box-shadow:0 6px 0 var(--ink);animation:wiggle 1.4s ease-in-out infinite;text-shadow:0 2px 0 var(--ink)}
.daily b{font-size:1.5em}
.world{max-width:720px;margin:0 auto 5vmin;border:5px solid var(--ink);border-radius:32px;background:var(--wbg);box-shadow:0 10px 0 var(--ink);overflow:hidden;position:relative}
.world::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1.6px,transparent 1.8px);background-size:18px 18px;pointer-events:none}
.world.locked{filter:grayscale(.8) brightness(.75)}
.wHead{position:relative;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(43,16,85,.5);font-weight:900;font-size:1.3em;text-shadow:0 2px 0 var(--ink)}
.wHead .wi{font-size:1.5em}
.wPath{position:relative;height:500px}
.wPath svg{position:absolute;inset:0;width:100%;height:100%}
.road{fill:none;stroke:rgba(43,16,85,.5);stroke-width:26;stroke-linecap:round;vector-effect:non-scaling-stroke}
.roadDash{fill:none;stroke:rgba(255,255,255,.9);stroke-width:7;stroke-dasharray:3 16;stroke-linecap:round;vector-effect:non-scaling-stroke}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(86px,14vmin,104px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0,#ffe66d 35%,#ff9f1c 100%);box-shadow:0 7px 0 var(--ink);padding:0}
.node:active{transform:translate(-50%,-44%)}
.node.boss{width:clamp(108px,17vmin,130px);background:radial-gradient(circle at 35% 30%,#fff 0,#ff9ec4 35%,#e5007a 100%)}
.node.done{background:radial-gradient(circle at 35% 30%,#fff 0,#b9fbc0 35%,#22c55e 100%)}
.node.lock{background:radial-gradient(circle at 35% 30%,#eee 0,#adb5bd 50%,#6c757d 100%)}
.node.lock .nIn{filter:grayscale(1) brightness(.55)}
.node.cur{animation:nodePulse 1.2s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 7px 0 var(--ink),0 0 0 0 rgba(255,255,255,.8)}50%{box-shadow:0 7px 0 var(--ink),0 0 0 16px rgba(255,255,255,0)}}
.nIn{position:absolute;inset:6%}
.nIn svg{width:100%;height:100%}
.nNum{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;border-radius:12px;padding:0 10px;font-size:1em;border:3px solid #fff;white-space:nowrap}
.nLock{position:absolute;top:-8px;right:-8px;font-size:1.5em}
.nStars{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:1.25em;letter-spacing:-2px}
.nStars .stars b{-webkit-text-stroke:1.5px var(--ink);text-shadow:0 2px 0 var(--ink)}
.here{position:absolute;top:-66px;left:50%;transform:translateX(-50%);animation:hereBob 1s ease-in-out infinite}
@keyframes hereBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
.mapEnd{text-align:center;font-weight:900;font-size:1.3em;text-shadow:var(--ol);padding:2vmin}

/* stones */
.stoneBtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:#fff}
.stone{position:relative;width:clamp(74px,13.5vmin,124px);height:clamp(64px,11.5vmin,106px);border-radius:48% 52% 45% 55%/55% 48% 52% 45%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--c1) 34%,var(--c2) 100%);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 0 26px var(--c1);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(28px,5.4vmin,50px);color:#fff;text-shadow:0 3px 0 var(--ink);animation:stoneBob 2.4s ease-in-out infinite}
.stone.super{background:conic-gradient(from 0deg,#ff595e,#ffca3a,#8ac926,#1982c4,#6a4c93,#ff595e);box-shadow:0 6px 0 var(--ink),0 0 34px #ffd60a}
.stone .cnt{position:absolute;top:-10px;left:-10px;background:#ff006e;border:3px solid var(--ink);border-radius:50%;min-width:32px;height:32px;font-size:17px;display:flex;align-items:center;justify-content:center;text-shadow:none}
.stoneBtn:active .stone{transform:scale(.9)}
.stoneBtn .lbl{font-weight:800;font-size:.95em;background:rgba(43,16,85,.8);padding:3px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.4)}
@keyframes stoneBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

/* battle */
.battle{flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
.bhud{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 14px 0;padding-top:max(10px,env(safe-area-inset-top));position:relative;z-index:5}
.hudR,.hudL{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#hudHearts{font-size:1.15em;gap:1px;padding:4px 10px}
#hudHearts.low{animation:lowPulse .8s infinite}
@keyframes lowPulse{50%{background:#ffc2d1;transform:scale(1.06)}}
.hh.empty{opacity:.55}
.vInfo{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.vname{font-weight:900;font-size:1.1em;text-shadow:var(--ol)}
.hpbar{position:relative;width:min(34vw,290px);height:26px;border:4px solid var(--ink);border-radius:14px;background:#2b1055;overflow:hidden}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ff006e,#ff9f1c,#ffd60a);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
#hpTxt{position:absolute;inset:0;direction:ltr;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:900;text-shadow:0 1px 2px #000}
.arena{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:space-evenly;padding:0 3vw 1vmin}
.ground{position:absolute;left:-10%;right:-10%;bottom:-6vh;height:32%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.4),rgba(255,255,255,.1) 55%,transparent 75%);pointer-events:none}
.combo{position:absolute;left:50%;top:6px;transform:translateX(-50%) scale(0);font-weight:900;font-size:1.3em;padding:4px 16px;border-radius:999px;background:linear-gradient(90deg,#ff006e,#ff9f1c);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .3s cubic-bezier(.2,1.8,.4,1);z-index:4;white-space:nowrap}
.combo.on{transform:translateX(-50%) scale(1)}
.vs{align-self:center;font-size:clamp(30px,7vmin,64px);animation:pulse 1.2s infinite;filter:drop-shadow(0 4px 0 var(--ink));z-index:1}
.heroWrap{position:relative;height:min(100%,46vh,64vw);aspect-ratio:200/270;z-index:2;animation:heroIdle 2s ease-in-out infinite}
.heroWrap>svg{width:100%;height:100%;overflow:visible}
@keyframes heroIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
.throwArm{transform-box:view-box;transform-origin:66px 124px}
.heroWrap.throw{animation:heroLunge .5s ease}
.heroWrap.throw .throwArm{animation:throwArm .5s ease}
@keyframes throwArm{0%{transform:rotate(0)}35%{transform:rotate(-35deg)}65%{transform:rotate(115deg)}100%{transform:rotate(0)}}
@keyframes heroLunge{0%,100%{transform:none}60%{transform:translateX(-7%) rotate(-4deg)}}
.heroWrap.hurt{animation:heroHurt .65s ease}
@keyframes heroHurt{0%{transform:none;filter:none}15%{transform:translateX(10%) rotate(7deg);filter:drop-shadow(0 0 14px #ff004c) brightness(1.4)}35%{transform:translateX(-6%)}55%{transform:translateX(4%)}100%{transform:none;filter:none}}
.shieldB{position:absolute;inset:-6% -14%;border-radius:50%;border:5px solid rgba(155,246,255,.9);background:radial-gradient(circle,rgba(155,246,255,0) 55%,rgba(155,246,255,.5));opacity:0;pointer-events:none;transition:opacity .3s}
.heroWrap.hasShield .shieldB{opacity:.35}
.shieldB.on{animation:shieldOn .9s ease}
@keyframes shieldOn{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.1)}100%{opacity:.35;transform:scale(1)}}
.villWrap{position:relative;height:min(92%,40vh,42vw);aspect-ratio:224/250;z-index:2;margin-bottom:1%}
.villWrap.boss{height:min(100%,48vh,48vw)}
.vInner{width:100%;height:100%;animation:villIdle 2.4s ease-in-out infinite}
.vInner svg,.iVill svg{width:100%;height:100%;overflow:visible}
@keyframes villIdle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4%) scale(1.03,.97)}}
.villWrap.vhit .vInner{animation:vhit .5s ease}
@keyframes vhit{0%{transform:none;filter:brightness(3) saturate(0)}20%{transform:translateX(-14%) rotate(-9deg)}40%{transform:translateX(8%) rotate(5deg);filter:brightness(1.6)}60%{transform:translateX(-5%)}100%{transform:none;filter:none}}
.villWrap.vatk .vInner{animation:vatk .55s ease}
@keyframes vatk{0%{transform:none}40%{transform:translateX(-8%) scale(.9)}70%{transform:translateX(18%) scale(1.14)}100%{transform:none}}
.villWrap.vdead .vInner{animation:vdead 1.1s ease-in forwards}
@keyframes vdead{0%{transform:none;filter:brightness(2.5)}30%{transform:rotate(-20deg) scale(1.15)}100%{transform:rotate(540deg) scale(0);opacity:0}}
.bubble{position:absolute;top:2%;left:68%;transform:scale(0);transform-origin:0 100%;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:8px 14px;font-weight:900;font-size:1.05em;white-space:nowrap;box-shadow:0 5px 0 var(--ink);z-index:6;transition:transform .25s cubic-bezier(.2,1.8,.4,1)}
.bubble.on{transform:scale(1)}
.bubble::after{content:'';position:absolute;bottom:-20px;left:16px;border:10px solid transparent;border-top:14px solid var(--ink)}
.pouchBar{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2vw calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(43,16,85,0),rgba(43,16,85,.62) 45%)}
.pouchLabel{font-weight:900;font-size:1.2em;text-shadow:var(--ol)}
.stones{display:flex;gap:clamp(14px,4vw,46px);align-items:flex-end;position:relative}
.battle.busy .stones{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.tapHint{position:absolute;bottom:62%;right:8%;font-size:3.2em;animation:tap 1s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 3px 0 var(--ink))}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(16px)}}
.floater{position:absolute;z-index:26;font-size:clamp(46px,8.5vmin,74px);background:none;border:none;padding:12px;line-height:1;animation:floatUp 6.5s linear forwards;filter:drop-shadow(0 0 14px rgba(255,255,255,.95))}
.floater.gone{transition:opacity .4s;opacity:0}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.3);opacity:0}8%{transform:translate(-50%,-5vh) scale(1.15);opacity:1}25%{transform:translate(calc(-50% + 4vw),-15vh) scale(1)}50%{transform:translate(calc(-50% - 4vw),-30vh) scale(1.08)}75%{transform:translate(calc(-50% + 4vw),-45vh) scale(1)}100%{transform:translate(-50%,-60vh) scale(1);opacity:.9}}

/* effects */
.proj{position:absolute;left:0;top:0;width:clamp(46px,8.5vmin,70px);height:clamp(40px,7.5vmin,62px);border-radius:48% 52% 45% 55%/55% 48% 52% 45%;background:radial-gradient(circle at 35% 30%,#fff 0 10%,var(--c1) 36%,var(--c2));border:4px solid var(--ink);box-shadow:0 0 30px var(--c1),0 0 60px var(--c1);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:1.5em;text-shadow:0 2px 0 var(--ink)}
.proj.super{width:clamp(70px,12vmin,100px);height:clamp(64px,11vmin,92px);background:conic-gradient(#ff595e,#ffca3a,#8ac926,#1982c4,#6a4c93,#ff595e);box-shadow:0 0 40px #fff,0 0 80px #ffd60a}
.vproj{position:absolute;left:0;top:0;width:clamp(42px,7vmin,62px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--c1) 40%,var(--c2));border:4px solid var(--ink);box-shadow:0 0 26px var(--c2)}
.flyItem{position:absolute;left:0;top:0;font-size:30px;line-height:1;will-change:transform}
.ftxt{position:absolute;direction:ltr;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(26px,5vmin,46px);color:#fff;text-shadow:var(--ol);animation:ft 1.3s ease-out forwards;pointer-events:none;white-space:nowrap;z-index:87}
.ftxt.dmg{color:#ff4d6d;font-size:clamp(38px,8vmin,70px)}
.ftxt.pts{color:#9bf6ff}
.ftxt.coinTxt{color:#ffd60a}
.ftxt.big{font-size:clamp(40px,8vmin,70px)}
@keyframes ft{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-80%) scale(1.15);opacity:1}100%{transform:translate(-50%,-220%) scale(1);opacity:0}}
.cburst{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:cb 1s cubic-bezier(.2,1.6,.4,1) forwards}
.cburst .b1,.cburst .b2{position:absolute;clip-path:var(--burst);-webkit-clip-path:var(--burst)}
.cburst .b1{inset:-58% -34%;background:var(--ink)}
.cburst .b2{inset:-48% -27%;background:radial-gradient(circle,#fffbd0 0,var(--c,#ffbe0b) 55%,#ff5400 100%)}
.cburst .tx{position:relative;font-weight:900;font-size:clamp(30px,6.5vmin,60px);color:#fff;text-shadow:var(--ol),0 5px 0 var(--ink);white-space:nowrap;padding:.1em .3em}
.cburst.big .tx{font-size:clamp(40px,9vmin,84px)}
@keyframes cb{0%{transform:translate(-50%,-50%) scale(.2) rotate(-18deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg);opacity:1}75%{transform:translate(-50%,-50%) scale(1) rotate(-5deg);opacity:1}100%{transform:translate(-50%,-60%) scale(1.08) rotate(-5deg);opacity:0}}
.bigMsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(36px,8vmin,76px);color:#fff;text-shadow:var(--ol),0 6px 0 var(--ink);white-space:nowrap;animation:bigMsg 1.8s ease forwards;pointer-events:none;z-index:87}
@keyframes bigMsg{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{transform:translate(-50%,-50%) scale(1.2);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}

/* puzzle */
.pz{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(20,5,50,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding:2vmin}
.pzCard{width:min(96vw,840px);max-height:100%;overflow:auto;background:linear-gradient(170deg,#fffdf5,#ffeefb);color:var(--ink);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);padding:0 2.6vmin 2.4vmin;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.pzHead{display:flex;align-items:center;gap:12px;margin:0 -2.6vmin 2vmin;padding:1.4vmin 2.6vmin;background:linear-gradient(90deg,var(--c1),var(--c2));border-bottom:5px solid var(--ink)}
.pzHead h2{flex:1;font-weight:900;font-size:clamp(22px,4.4vmin,40px);color:#fff;text-shadow:var(--ol)}
.stone.mini{width:58px;height:50px;font-size:26px;animation:none;box-shadow:0 3px 0 var(--ink)}
.sayBtn{width:58px;height:58px;border-radius:50%;border:4px solid var(--ink);background:#fff;font-size:1.6em;box-shadow:0 4px 0 var(--ink);flex:none}
.sayBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pzFoot{display:flex;justify-content:center;margin-top:2.2vmin}
.spPic{font-size:clamp(76px,16vmin,150px);line-height:1.1;text-align:center;filter:drop-shadow(0 6px 0 rgba(43,16,85,.2));cursor:pointer;animation:picBob 2s ease-in-out infinite}
@keyframes picBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.spWord{text-align:center;font-weight:900;font-size:clamp(32px,6vmin,56px);min-height:1.4em;color:#7b2cbf}
.slots{display:flex;justify-content:center;gap:1.4vmin;margin:1.2vmin 0 2.4vmin}
.slot{width:clamp(58px,11vmin,94px);height:clamp(66px,12.5vmin,106px);border:4px dashed #b197fc;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,7.6vmin,66px);font-weight:800;color:var(--ink)}
.slot.f{border-style:solid;border-color:var(--ink);background:#fff7d6;animation:slotIn .22s cubic-bezier(.2,1.8,.4,1)}
.slot.fixed{background:#ece2ff;border-style:solid;border-color:#7b2cbf}
.slot.ok{background:#b9fbc0;border-color:#16a34a}
.slot.bad{background:#ffc2d1;border-color:#e11d48;animation:shake .4s}
.slot.show{background:#fff3b0;border-color:#f59e0b;border-style:solid}
@keyframes slotIn{from{transform:scale(.5)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:1.5vmin}
.tile{width:clamp(58px,11vmin,94px);height:clamp(58px,11vmin,94px);border:4px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,#fff,#ffd6ec);box-shadow:0 6px 0 var(--ink);font-size:clamp(36px,7.2vmin,62px);font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile.used{visibility:hidden}
.eq{direction:ltr;display:flex;justify-content:center;align-items:center;gap:1.6vmin;font-weight:900;font-size:clamp(46px,10vmin,98px);color:var(--ink);margin:1vmin 0 2.4vmin}
.eq .q{display:inline-flex;min-width:1.25em;justify-content:center;border:4px dashed #f77f00;border-radius:18px;background:#fff3c4;padding:0 .15em}
.eq .q.ok{border-style:solid;border-color:#16a34a;background:#b9fbc0}
.vis{direction:ltr;display:flex;justify-content:center;align-items:center;gap:2vmin;flex-wrap:wrap;margin:.5vmin 0 1vmin}
.vop{font-size:clamp(34px,6vmin,56px);font-weight:900;color:#f77f00}
.grp{display:flex;flex-wrap:wrap;max-width:min(40vw,300px);justify-content:center;gap:3px;font-size:clamp(26px,5vmin,44px);line-height:1.1;background:rgba(255,255,255,.8);border:3px solid #e9d5ff;border-radius:16px;padding:6px 8px}
.o{position:relative;display:inline-block}
.o.x i{opacity:.3;font-style:normal}
.o i{font-style:normal}
.o.x b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e11d48;font-size:.9em}
.opts{display:flex;justify-content:center;gap:2.2vmin;flex-wrap:wrap;direction:ltr}
.opt{min-width:clamp(82px,15vmin,134px);height:clamp(82px,15vmin,134px);border:5px solid var(--ink);border-radius:26px;background:linear-gradient(180deg,#fff,#fff0b3);box-shadow:0 7px 0 var(--ink);font-size:clamp(42px,8vmin,74px);font-weight:900;color:var(--ink)}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.opt.ok{background:linear-gradient(180deg,#d9ffdf,#5cf27a)}
.opt.bad{background:linear-gradient(180deg,#ffe0e6,#ff8fa3);animation:shake .4s;opacity:.7}
.opt.hint{background:linear-gradient(180deg,#fff9c4,#ffd60a);animation:pulse .7s infinite}
.mt{position:relative;display:flex;justify-content:space-between;touch-action:none;padding:1vmin 1vw}
.mcol{display:flex;flex-direction:column;gap:1.8vmin;z-index:2;width:34%}
.mcard{position:relative;height:clamp(66px,12vmin,104px);border:4px solid var(--ink);border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--ink);font-weight:800;color:var(--ink);transition:background .2s}
.mcard.word{font-size:clamp(30px,6vmin,54px);background:linear-gradient(180deg,#fff,#dff1ff)}
.mcard.pic{font-size:clamp(40px,8.5vmin,74px);background:linear-gradient(180deg,#fff,#ffeaf4)}
.mcard .dot{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:#ffbe0b;border:4px solid var(--ink)}
.mcard.word .dot{left:-15px}
.mcard.pic .dot{right:-15px}
.mcard.sel{outline:6px solid #ffbe0b;outline-offset:2px;transform:scale(1.04)}
.mcard.done{background:#b9fbc0}
.mcard.done .dot{background:#22c55e}
.mcard.bad{animation:shake .4s;background:#ffc2d1}
.mt svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.ln{fill:none;stroke-width:9;stroke-linecap:round}
.ln.ok{stroke:#22c55e;filter:drop-shadow(0 0 6px rgba(34,197,94,.8))}
.ln.drawing{stroke:#ffbe0b;stroke-dasharray:4 14}
.ln.bad{stroke:#e11d48}

/* win / lose / intro */
.win,.lose,.intro{text-align:center}
.winTitle,.loseTitle{font-weight:900;font-size:clamp(44px,10vmin,86px);color:#ffd60a;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);transform:rotate(-3deg);line-height:1.15;margin-bottom:6px}
.loseTitle{color:#ff8fab}
.loseEmoji{font-size:clamp(60px,12vmin,110px)}
.lose p{font-size:1.25em;font-weight:700;margin:8px 0}
.winStars{display:flex;justify-content:center;gap:2vmin}
.ws{font-size:clamp(56px,11vmin,94px);color:#d9d2ea;display:inline-block;transform:scale(.4);opacity:.4;transition:all .4s cubic-bezier(.2,1.8,.4,1);-webkit-text-stroke:3px var(--ink)}
.ws.on{color:#ffd60a;transform:scale(1.12) rotate(-8deg);opacity:1}
.ws.off{transform:scale(.85);opacity:.6}
.winRows{display:flex;flex-direction:column;gap:6px;font-size:1.2em;font-weight:700;margin:10px 0}
.nb{background:#ff006e;color:#fff;border-radius:10px;padding:2px 8px;font-size:.8em;display:inline-block;animation:pulse 1s infinite}
.chestBox{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.chestHint{font-weight:900;color:#7b2cbf;animation:pulse 1s infinite;font-size:1.1em}
.chestBox.opened .chestHint{visibility:hidden}
.chest{width:clamp(120px,21vmin,180px);cursor:pointer;animation:chestBob 1.2s ease-in-out infinite;overflow:visible}
@keyframes chestBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.chest.shakeC{animation:chestShake .1s linear infinite}
@keyframes chestShake{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
.chest.open{animation:none}
.chest .lid{transform-box:view-box;transform-origin:14px 52px;transition:transform .45s cubic-bezier(.3,1.7,.5,1)}
.chest.open .lid{transform:rotate(-38deg) translate(-4px,-8px)}
.chest .glow{opacity:0;transition:opacity .4s;transform-box:view-box;transform-origin:60px 58px}
.chest.open .glow{opacity:1;animation:spin 6s linear infinite}
.chestReward{font-size:1.45em;font-weight:900;min-height:1.6em;color:#e85d04;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.chestReward:not(:empty){animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.iWorld{font-weight:800;color:#7b2cbf;font-size:1.1em}
.iVill{height:min(32vh,250px);aspect-ratio:224/250;margin:6px auto;animation:villIdle 2.4s ease-in-out infinite}
.iName{font-size:clamp(30px,6vmin,50px);font-weight:900;color:#e5007a;-webkit-text-stroke:1.5px var(--ink)}
.iInfo{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;margin:6px 0}
.iInfo span{background:#f3e8ff;border:3px solid var(--ink);border-radius:14px;padding:4px 12px}
.iBest{font-weight:700;color:#555;margin-top:4px}
.iBest .stars b{-webkit-text-stroke:1px var(--ink);text-shadow:none;color:#ddd}
.iBest .stars b.on{color:#ffbe0b}

/* pages */
.page{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:2.5vmin 3vw 8vmin}
.panel{max-width:880px;margin:0 auto;background:linear-gradient(170deg,#fff,#f6efff);color:var(--ink);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);padding:clamp(14px,3vmin,28px)}
.ph{font-weight:900;font-size:1.8em;text-align:center;margin-bottom:12px}
.shopTop{display:flex;align-items:center;gap:3vmin;justify-content:center;flex-wrap:wrap}
.shopHero{height:min(30vh,250px);aspect-ratio:200/270;animation:heroIdle 2s ease-in-out infinite}
.wallet{font-size:1.6em;font-weight:900;display:flex;align-items:center;gap:8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:16px 0}
.item{border:4px solid var(--ink);border-radius:22px;background:#fff;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 5px 0 var(--ink)}
.item .ic{font-size:3em;line-height:1.1}
.item .nm{font-weight:900;font-size:1.15em}
.item .ds{font-size:.88em;opacity:.8;flex:1}
.secT{font-weight:900;font-size:1.3em;margin:10px 0}
.capes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.capeSw{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:var(--g);box-shadow:0 4px 0 var(--ink)}
.item.on{background:#e9ffe9;border-color:#16a34a}
.lb{margin-top:6px}
.lbRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:#fff;border:3px solid #e2d5ff;margin-bottom:8px;font-weight:800}
.lbRow.me{border-color:#ffbe0b;background:#fffbe6}
.lbRow .nm{flex:1;font-size:1.1em}
.lbRow .lv{opacity:.7}
.lbRow .st{color:#f59e0b;white-space:nowrap}
.rk{font-size:1.5em;min-width:1.6em;text-align:center}
.sc{font-weight:900;color:#7b2cbf;font-size:1.15em}
.tabs{display:flex;gap:8px;justify-content:center;margin:16px 0 10px}
.tab{font-weight:900;font-size:1.05em;border:3px solid var(--ink);border-radius:14px;padding:.4em 1.1em;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.tab.on{background:linear-gradient(180deg,#ffe66d,#ff9f1c)}
.myStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.myStats div{background:linear-gradient(180deg,#f3e8ff,#e0c3fc);border:3px solid var(--ink);border-radius:18px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.myStats b{font-size:1.6em}
.myStats span{font-size:.8em;font-weight:700}
.empty{text-align:center;font-weight:700;padding:14px}
.tgl{display:flex;width:100%;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:10px;border:3px solid var(--ink);border-radius:18px;background:#fff;font-weight:800;font-size:1.15em;color:var(--ink)}
.tgl i{width:64px;height:36px;border-radius:999px;background:#cfcfe0;position:relative;border:3px solid var(--ink);transition:background .2s;flex:none}
.tgl i::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:right .2s}
.tgl.on i{background:#22c55e}
.tgl.on i::after{right:29px}
.setBtns{display:flex;flex-direction:column;gap:10px;margin-top:8px}
@media (max-height:520px){
  .pzHead{padding:1vmin 2vmin}
  .stone{width:62px;height:54px;font-size:26px}
}
@media (max-width:560px){
  .myStats{grid-template-columns:repeat(2,1fr)}
  .hpbar{width:38vw}
}

/* ===== v2 additions ===== */
.stones{gap:clamp(10px,3vw,40px)}
.stone{width:clamp(62px,12vmin,116px);height:clamp(54px,10.4vmin,100px)}
.stone .slv{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:2px solid #fff;border-radius:10px;font-size:12px;line-height:1;padding:3px 7px;text-shadow:none;white-space:nowrap;font-weight:900}
.stone[data-tier="2"]{box-shadow:0 6px 0 var(--ink),inset 0 0 0 4px #e5e7eb,0 0 26px var(--c1)}
.stone[data-tier="3"]{box-shadow:0 6px 0 var(--ink),inset 0 0 0 4px #ffd60a,0 0 30px #ffd60a}
.stone[data-tier="4"]{box-shadow:0 6px 0 var(--ink),inset 0 0 0 4px #9bf6ff,0 0 34px #9bf6ff,0 0 60px var(--c1)}
.stone[data-tier="4"]::before{content:'✦';position:absolute;top:-4px;right:4px;font-size:18px;color:#fff;animation:twinkle 1.2s infinite}

.stoneBtn .x2{position:absolute;top:-14px;right:-12px;background:#ff006e;color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:1px 7px;font-size:15px;z-index:3;animation:pulse 1s infinite;text-shadow:none}

.stoneBtn .newB{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:10px;padding:0 6px;font-size:13px;z-index:3;white-space:nowrap}

.stone.mini .slv,.stone.tiny .slv{display:none}
.stone.tiny{width:34px;height:30px;font-size:16px;animation:none;border-width:3px;box-shadow:none;display:inline-flex;vertical-align:middle}
.weakTag{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.85em;background:rgba(43,16,85,.78);padding:2px 10px 2px 4px;border-radius:12px;white-space:nowrap}
.heroLv{background:linear-gradient(180deg,#ffe66d,#ff9f1c);color:var(--ink)}
/* villain damage + shield + cage */
.vdmg1,.vdmg2{display:none}
.villWrap.h1 .vdmg1,.villWrap.h2 .vdmg1,.villWrap.h2 .vdmg2{display:inline}

@keyframes dizzy{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.vShield{position:absolute;inset:-8% -12%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0) 48%,var(--sc,#4cc9f0) 100%);border:6px solid var(--sc,#4cc9f0);opacity:0;transform:scale(.5);transition:all .45s cubic-bezier(.2,1.6,.4,1);display:flex;align-items:flex-start;justify-content:center;pointer-events:none;z-index:3}
.vShield.on{opacity:.9;transform:scale(1);animation:shieldWob 2s ease-in-out infinite}
@keyframes shieldWob{50%{transform:scale(1.04)}}
.vShield .stone{width:58px;height:50px;font-size:24px;margin-top:-26px;animation:none}
.cage{position:absolute;bottom:2%;left:-8%;display:flex;flex-direction:column-reverse;gap:6px;z-index:4}
.cage span{position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px;font-size:26px;border:3px solid var(--ink);border-radius:10px;background:#fff3d6;animation:wiggle 2s infinite}
.cage span::after{content:'';position:absolute;inset:0;border-radius:7px;background:repeating-linear-gradient(90deg,rgba(43,16,85,.85) 0 3px,transparent 3px 11px)}
/* scenery */
.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;pointer-events:none;animation:sceneDrift 18s ease-in-out infinite alternate}
.sceneTop{position:absolute;left:0;right:0;top:0;width:100%;height:28%;pointer-events:none}
@keyframes sceneDrift{from{transform:translateX(-1.5%)}to{transform:translateX(1.5%)}}
/* VS intro */
.vsIntro{position:absolute;inset:0;z-index:75;overflow:hidden;pointer-events:auto}
.vsSide{position:absolute;top:0;bottom:0;width:60%;display:flex;align-items:center;justify-content:center}
.vsSide.h{right:0;padding-left:16%;background:linear-gradient(135deg,#3a86ff,#8338ec);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%);animation:vsInR .45s cubic-bezier(.2,1.4,.4,1) both}
.vsSide.v{left:0;padding-right:16%;background:linear-gradient(135deg,#ff006e,#fb5607);clip-path:polygon(0 0,100% 0,75% 100%,0 100%);animation:vsInL .45s cubic-bezier(.2,1.4,.4,1) both}
.vsSide::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.2px);background-size:16px 16px}
.vsBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.vsBox .av{border-width:6px}
.vsBox .vbox{width:min(36vmin,250px);aspect-ratio:224/250}
.vsBox .vbox svg{width:100%;height:100%;overflow:visible}
.vsName{font-weight:900;font-size:clamp(24px,5vmin,46px);text-shadow:var(--ol),0 5px 0 var(--ink)}
.vsSub{font-weight:800;background:rgba(43,16,85,.6);border-radius:12px;padding:2px 12px}
.vsMid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(64px,16vmin,150px);color:#ffd60a;-webkit-text-stroke:4px var(--ink);text-shadow:0 8px 0 var(--ink);animation:vsMid .6s .3s cubic-bezier(.2,1.8,.4,1) both;z-index:2;font-family:Arial Black,Rubik,sans-serif}
@keyframes vsInR{from{transform:translateX(100%)}}
@keyframes vsInL{from{transform:translateX(-100%)}}
@keyframes vsMid{from{transform:translate(-50%,-50%) scale(0) rotate(-30deg)}}
.vsIntro.out .vsSide.h{animation:vsOutR .35s ease-in forwards}
.vsIntro.out .vsSide.v{animation:vsOutL .35s ease-in forwards}
.vsIntro.out .vsMid{animation:fadeOut .3s forwards}
@keyframes vsOutR{to{transform:translateX(110%)}}
@keyframes vsOutL{to{transform:translateX(-110%)}}
@keyframes fadeOut{to{opacity:0;transform:translate(-50%,-50%) scale(2)}}

.opt.gone{opacity:.15;pointer-events:none}

.tracer{position:relative;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
.trSvg{width:100%;height:100%;display:block;overflow:visible;touch-action:none}
.tUnder path{fill:none;stroke:#1a1033;stroke-linecap:round;stroke-linejoin:round}
.tUnder.flash path{animation:outFlash .45s}
@keyframes outFlash{25%{stroke:#ff1744}}
.tOver path{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.tInk path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tGuide path{fill:none;stroke-linecap:round;stroke-width:1.7;stroke-dasharray:3.2 3.2}
.tGuide .gCur{stroke:#7b2cbf;stroke-width:2.1;animation:dashMove .9s linear infinite}
.tGuide .gNext{stroke:#c9b8ec}
.tGuide .gDone{stroke:transparent}
@keyframes dashMove{to{stroke-dashoffset:-6.4}}
.startDot{fill:#22c55e;stroke:#1a1033;stroke-width:1.3;transform-box:fill-box;transform-origin:center;animation:dotPulse 1s ease-in-out infinite}
.mCur.nudge .startDot{animation:dotPulse .22s 5}
@keyframes dotPulse{50%{transform:scale(1.28)}}
.startNum{fill:#fff;font-weight:900;font-family:Rubik,Arial,sans-serif;pointer-events:none}
.arrowH{fill:#7b2cbf;stroke:#fff;stroke-width:.6}
.chev{fill:none;stroke:#7b2cbf;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tFinger{fill:rgba(255,214,10,.9);stroke:#1a1033;stroke-width:.8;pointer-events:none}
.tFinger.out{fill:rgba(255,23,68,.9)}
.tHand{position:absolute;left:0;top:0;font-size:clamp(54px,10vmin,100px);line-height:1;pointer-events:none;opacity:0;transition:opacity .25s;filter:drop-shadow(0 5px 0 rgba(26,16,51,.35));will-change:transform;z-index:3}
.tHand.on{opacity:1}
.tracer.tDone .tOver path{animation:glowW 1s}
@keyframes glowW{40%{stroke:#fff36b}}
.trScreen{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));padding-top:max(8px,env(safe-area-inset-top));gap:8px}

/* ===================== v5: סגנונות צבע + תלת-ממד ===================== */
/* --- במה תלת-ממדית --- */
.arena{isolation:isolate;overflow:hidden;border-radius:0}
.stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-evenly;padding:0 3vw 1vmin;perspective:1000px;perspective-origin:50% 40%}
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.stage .scene{bottom:28%;height:48%;animation:sceneDrift 18s ease-in-out infinite alternate}
.floor3d{position:absolute;left:0;right:0;bottom:0;height:32%;perspective:260px;perspective-origin:50% 0;overflow:hidden;pointer-events:none}
.floorPlane{position:absolute;left:-80%;right:-80%;top:0;height:320%;transform-origin:50% 0;transform:rotateX(78deg);background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.04))}
.atmo{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.grade{position:absolute;inset:0;pointer-events:none}
.grade i{position:absolute;inset:0}
.styleTag{position:absolute;top:8px;right:10px;z-index:21;font-weight:800;font-size:.8em;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;border:2px solid rgba(255,255,255,.5);pointer-events:none;animation:tagIn 4s ease forwards}
@keyframes tagIn{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:.0}}
.stage .ground{opacity:.6}
/* תנועות תלת-ממד לדמויות */
@keyframes heroIdle{0%,100%{transform:translateY(0) rotateY(-12deg)}50%{transform:translateY(-3%) rotateY(10deg)}}
@keyframes villIdle{0%,100%{transform:translateY(0) rotateY(14deg) scale(1,1)}50%{transform:translateY(-4%) rotateY(-12deg) scale(1.03,.97)}}
@keyframes vhit{0%{transform:none;filter:brightness(3) saturate(0)}20%{transform:translateX(-14%) rotateY(60deg) translateZ(-90px)}45%{transform:translateX(8%) rotateY(-25deg);filter:brightness(1.6)}70%{transform:rotateY(10deg)}100%{transform:none;filter:none}}
@keyframes vdead{0%{transform:none;filter:brightness(2.5)}30%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(1080deg) rotateZ(40deg) scale(0) translateZ(-300px);opacity:0}}
.heroWrap.combo3::before{content:'';position:absolute;left:5%;right:5%;bottom:-4%;height:16%;border-radius:50%;border:5px solid #ffd60a;box-shadow:0 0 22px #ffd60a,inset 0 0 18px #ff9f1c;transform:rotateX(72deg);animation:portal 1.2s linear infinite;z-index:-1}
@keyframes portal{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
/* אבנים מסתובבות בתלת-ממד */
@keyframes stoneBob{0%,100%{transform:perspective(320px) rotateY(-22deg) rotateX(10deg) translateY(0)}50%{transform:perspective(320px) rotateY(22deg) rotateX(-8deg) translateY(-7px)}}
/* קוביית אבן תלת-ממדית */
.proj3d{position:absolute;left:0;top:0;width:var(--gs,60px);height:var(--gs,60px);perspective:420px;z-index:2}
.proj3d.super{--gs:86px}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cubeSpin .55s linear infinite}
.cube i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;color:#fff;font-size:calc(var(--gs,60px)*.45);text-shadow:0 2px 0 #2b1055;background:radial-gradient(circle at 30% 25%,#fff 0 8%,var(--c1) 40%,var(--c2));border:3px solid #2b1055;border-radius:24%;box-shadow:inset 0 0 14px rgba(255,255,255,.55),0 0 22px var(--c1)}
.proj3d.super .cube i{background:conic-gradient(#ff595e,#ffca3a,#8ac926,#1982c4,#6a4c93,#ff595e)}
.cube .f1{transform:translateZ(calc(var(--gs,60px)/2))}
.cube .f2{transform:rotateY(180deg) translateZ(calc(var(--gs,60px)/2))}
.cube .f3{transform:rotateY(90deg) translateZ(calc(var(--gs,60px)/2))}
.cube .f4{transform:rotateY(-90deg) translateZ(calc(var(--gs,60px)/2))}
.cube .f5{transform:rotateX(90deg) translateZ(calc(var(--gs,60px)/2))}
.cube .f6{transform:rotateX(-90deg) translateZ(calc(var(--gs,60px)/2))}
@keyframes cubeSpin{from{transform:rotateX(0) rotateY(0)}to{transform:rotateX(360deg) rotateY(720deg)}}
.vproj .vring{position:absolute;inset:-28%;border:4px solid var(--c1);border-radius:50%;box-shadow:0 0 12px var(--c1);animation:vring .45s linear infinite}
@keyframes vring{from{transform:perspective(200px) rotateX(70deg) rotateZ(0)}to{transform:perspective(200px) rotateX(70deg) rotateZ(360deg)}}
.flyItem .coin{animation:coinSpin .38s linear infinite}
@keyframes coinSpin{from{transform:perspective(200px) rotateY(0)}to{transform:perspective(200px) rotateY(360deg)}}
.hudCoinSpin .coin,#hudCoins .coin{animation:coinSpin 2.6s linear infinite}
/* כרטיסים ומעברים בתלת-ממד */
@keyframes pop3d{from{transform:perspective(1000px) rotateX(-42deg) rotateY(14deg) translateY(40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.card,.pzCard{animation:pop3d .55s cubic-bezier(.2,1.35,.4,1);transform-origin:50% 0}
#screen.scrIn{animation:scrIn .55s cubic-bezier(.2,.9,.3,1)}
@keyframes scrIn{from{transform:perspective(1400px) rotateY(-16deg) translateZ(-200px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.ws.on{animation:starFlip .75s cubic-bezier(.2,1.4,.4,1)}
@keyframes starFlip{from{transform:perspective(400px) rotateY(540deg) scale(.2)}to{transform:perspective(400px) rotateY(0) scale(1.12) rotate(-8deg)}}
@keyframes chestBob{0%,100%{transform:perspective(500px) rotateY(-22deg) translateY(0)}50%{transform:perspective(500px) rotateY(22deg) translateY(-8px)}}
@keyframes cb{0%{transform:translate(-50%,-50%) perspective(600px) rotateY(-70deg) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) perspective(600px) rotateY(10deg) scale(1.15);opacity:1}75%{transform:translate(-50%,-50%) perspective(600px) rotateY(-4deg) scale(1);opacity:1}100%{transform:translate(-50%,-60%) perspective(600px) rotateY(0) scale(1.08);opacity:0}}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.3) rotateY(0);opacity:0}8%{transform:translate(-50%,-5vh) scale(1.15) rotateY(60deg);opacity:1}25%{transform:translate(calc(-50% + 4vw),-15vh) scale(1) rotateY(180deg)}50%{transform:translate(calc(-50% - 4vw),-30vh) scale(1.08) rotateY(360deg)}75%{transform:translate(calc(-50% + 4vw),-45vh) scale(1) rotateY(540deg)}100%{transform:translate(-50%,-60vh) scale(1) rotateY(720deg);opacity:.9}}
.tracer.tDone .trSvg{animation:spin3d 1s cubic-bezier(.3,1.3,.5,1)}
@keyframes spin3d{from{transform:perspective(900px) rotateY(0)}to{transform:perspective(900px) rotateY(360deg)}}
/* לוגו תלת-ממדי */
.title{perspective:1000px}
.logo{filter:drop-shadow(0 2px 0 #ff6fb5) drop-shadow(0 2px 0 #d6247a) drop-shadow(0 2px 0 #a3125c) drop-shadow(0 3px 0 #2b1055) drop-shadow(0 14px 18px rgba(0,0,0,.35));animation:logoIn .8s cubic-bezier(.2,1.6,.4,1),logo3d 6s ease-in-out .8s infinite}
@keyframes logo3d{0%,100%{transform:perspective(800px) rotateX(14deg) rotateY(-16deg) rotate(-3deg)}50%{transform:perspective(800px) rotateX(-8deg) rotateY(16deg) rotate(-3deg)}}
/* מפה בתלת-ממד */
.mapScroll{perspective:1400px}
.world{animation:worldIn .75s cubic-bezier(.2,1.2,.4,1) both;transform-origin:50% 0}
.world:nth-of-type(2){animation-delay:.08s}.world:nth-of-type(3){animation-delay:.16s}.world:nth-of-type(4){animation-delay:.24s}
@keyframes worldIn{from{transform:rotateX(38deg) translateZ(-140px);opacity:0}to{transform:none;opacity:1}}
.node.cur::after{content:'';position:absolute;left:-22%;right:-22%;bottom:-26%;height:42%;border:4px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 16px #fff;animation:portal 1.6s linear infinite;pointer-events:none}
.nSt{position:absolute;bottom:-6px;left:-8px;width:30px;height:30px;border-radius:50%;background:var(--sw);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.stChip{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px auto;padding:6px 14px;border-radius:16px;background:#fff;border:3px solid var(--ink);width:fit-content;font-weight:800}
.stChip .sw{width:34px;height:34px;border-radius:10px;border:3px solid var(--ink);background:var(--sw);animation:swSpin 4s ease-in-out infinite}
@keyframes swSpin{0%,100%{transform:perspective(200px) rotateY(-25deg)}50%{transform:perspective(200px) rotateY(25deg)}}
.stChip small{display:block;width:100%;text-align:center;font-weight:600;opacity:.75}
.intro{perspective:900px}
.vsMid{text-shadow:0 1px 0 #ffb703,0 2px 0 #fb8500,0 3px 0 #e85d04,0 4px 0 #dc2f02,0 5px 0 #9d0208,0 6px 0 #2b1055,0 12px 18px rgba(0,0,0,.5);animation:vsMid .6s .3s cubic-bezier(.2,1.8,.4,1) both,vsSwing 1.4s .9s ease-in-out infinite}
@keyframes vsSwing{0%,100%{transform:translate(-50%,-50%) perspective(500px) rotateX(18deg) rotateY(-14deg)}50%{transform:translate(-50%,-50%) perspective(500px) rotateX(-10deg) rotateY(14deg)}}
@keyframes vsInR{from{transform:perspective(900px) translateX(70%) rotateY(-75deg)}}
@keyframes vsInL{from{transform:perspective(900px) translateX(-70%) rotateY(75deg)}}

/* ===================== סגנונות ===================== */
/* מחסנית צבעים לנוף */
.scene .h1{fill:var(--s1,#fff);opacity:var(--o1,.25)}.scene .h2{fill:var(--s2,#fff);opacity:var(--o2,.3)}
.scene .ac{fill:var(--s3,#ffb3c6);opacity:var(--o3,.6)}.scene .ac2{fill:var(--s4,#ffd6a5);opacity:var(--o3,.6)}
.scene .gl{fill:var(--sg,#fff);opacity:.85}.scene .gl2{fill:var(--sg2,#fff);opacity:.25}.scene .gl3{fill:var(--sg3,var(--sg,#fff));opacity:.8}
.scene .ln{fill:none;stroke:var(--sg,#fff);stroke-width:3;opacity:.6}.scene .cl{fill:var(--scl,#e9ecef);opacity:.35}
.sceneTop .ac{fill:var(--s3,#c77dff);opacity:.4}.sceneTop .ac2{fill:var(--s4,#4cc9f0);opacity:.4}
.st-pop .scene *,.st-pop .sceneTop *{stroke:#111;stroke-width:4px}

/* 1. פופ-ארט */
.st-pop{--s1:#ff3d7f;--s2:#00b4ff;--s3:#ffde00;--s4:#7cff6b;--sg:#fff;--sg2:#111;--scl:#fff;--o1:1;--o2:1;--o3:1}
.st-pop .sky{background:#ffde00}
.popRays{position:absolute;left:50%;top:70%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(#ffde00 0 9deg,#ffb703 9deg 18deg);animation:spin 60s linear infinite}
.popDots{position:absolute;inset:0;background:radial-gradient(#ff3d7f 30%,transparent 33%) 0 0/18px 18px;opacity:.35;-webkit-mask:linear-gradient(180deg,#000,transparent 70%);mask:linear-gradient(180deg,#000,transparent 70%)}
.popCloud{position:absolute;width:22%;height:12%;background:#fff;border:5px solid #111;border-radius:999px;box-shadow:8px 8px 0 #111}
.popCloud.c1{left:6%;top:10%;animation:drift 9s ease-in-out infinite alternate}.popCloud.c2{right:12%;top:20%;width:16%;animation:drift 12s ease-in-out infinite alternate-reverse}
.st-pop .floorPlane{background:radial-gradient(#e63946 32%,transparent 35%) 0 0/34px 34px,#4cc9f0;animation:floorMove 2s linear infinite;--fm:34px}
.speed{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 60%,transparent 0 4deg,rgba(255,255,255,.35) 4deg 5deg);animation:spin 40s linear infinite reverse;-webkit-mask:radial-gradient(circle at 50% 60%,transparent 30%,#000 70%);mask:radial-gradient(circle at 50% 60%,transparent 30%,#000 70%)}
.st-pop .heroWrap>svg,.st-pop .vInner{filter:saturate(1.45) contrast(1.12) drop-shadow(7px 7px 0 #111)}
.st-pop .grade{box-shadow:inset 0 0 0 7px #111,inset 0 0 0 13px #fff,inset 0 0 0 16px #111}
.st-pop .grade .g1{background:radial-gradient(rgba(0,0,0,.18) 22%,transparent 25%) 0 0/9px 9px;mix-blend-mode:multiply;opacity:.5}

/* 2. דואו-טון */
.st-duo{--s1:#444;--s2:#777;--s3:#aaa;--s4:#999;--sg:#fff;--sg2:#222;--scl:#ddd;--o1:1;--o2:1;--o3:1}
.st-duo .sky{background:linear-gradient(180deg,#eee,#9a9a9a 70%,#666)}
.duoSun{position:absolute;right:12%;top:12%;width:22vmin;height:22vmin;border-radius:50%;background:radial-gradient(circle,#fff 40%,#ccc);box-shadow:0 0 60px #fff;animation:pulse 5s ease-in-out infinite}
.dshape{position:absolute;width:5vmin;height:5vmin;background:#fff;opacity:.55;animation:duoFloat linear infinite}
.dshape.c{border-radius:50%}.dshape.t{clip-path:polygon(50% 0,100% 100%,0 100%)}.dshape.s{transform:rotate(45deg)}
@keyframes duoFloat{0%{transform:translate(0,0) rotate(0) perspective(300px) rotateY(0)}50%{transform:translate(4vw,3vh) rotate(180deg) perspective(300px) rotateY(180deg)}100%{transform:translate(0,0) rotate(360deg) perspective(300px) rotateY(360deg)}}
.st-duo .floorPlane{background:repeating-conic-gradient(#bbb 0 25%,#555 0 50%) 0 0/70px 70px;animation:floorMove 1.6s linear infinite;--fm:70px}
.st-duo .stage{filter:grayscale(1) contrast(1.18) brightness(1.04)}
.st-duo .grade .g1{background:var(--d2);mix-blend-mode:multiply}
.st-duo .grade .g2{background:var(--d1);mix-blend-mode:screen}

/* 3. כחול-כתום קולנועי */
.st-teal{--s1:#06363d;--s2:#0b4d56;--s3:#d9772b;--s4:#127580;--sg:#ffb35c;--sg2:#032a30;--scl:#ffcf9c;--o1:.95;--o2:.95;--o3:.85}
.st-teal .sky{background:linear-gradient(180deg,#002a30 0%,#05505a 38%,#c4602b 74%,#ffb15c 100%)}
.tealSun{position:absolute;right:14%;top:44%;width:20vmin;height:20vmin;border-radius:50%;background:radial-gradient(circle,#fff6d6 0,#ffb15c 40%,rgba(255,140,40,0) 70%);box-shadow:0 0 120px 40px rgba(255,140,40,.45)}
.flare{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,200,140,.5),transparent 70%);animation:flare 6s ease-in-out infinite}
.flare.f1{left:50%;top:40%;width:8vmin;height:8vmin}.flare.f2{left:35%;top:30%;width:14vmin;height:14vmin;animation-delay:-2s;background:radial-gradient(circle,rgba(0,200,200,.35),transparent 70%)}.flare.f3{left:22%;top:20%;width:5vmin;height:5vmin;animation-delay:-4s}
@keyframes flare{50%{opacity:.4;transform:scale(1.3)}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffcf8a;box-shadow:0 0 8px #ff9a3c;animation:sparkUp linear infinite}
@keyframes sparkUp{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-8vw,-30vh);opacity:0}}
.st-teal .floorPlane{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 60px),linear-gradient(180deg,#b5541f,#0b3b42 60%);animation:floorMove 3s linear infinite;--fm:60px}
.st-teal .heroWrap>svg,.st-teal .vInner{filter:saturate(1.15) drop-shadow(-6px 0 10px rgba(0,190,200,.55)) drop-shadow(6px -2px 10px rgba(255,140,40,.7))}
.st-teal .grade .g1{background:linear-gradient(100deg,rgba(0,150,160,.55),rgba(0,150,160,0) 45%,rgba(255,140,40,0) 55%,rgba(255,140,40,.45));mix-blend-mode:soft-light}

/* 4. סינת'ווייב */

var CLOUD={ref:null,busy:false,dirty:false,last:'',tm:0};
function cloudQueue(){ if(!CLOUD.ref) return; CLOUD.dirty=true; clearTimeout(CLOUD.tm); CLOUD.tm=setTimeout(cloudPush,8000); }
async function cloudPush(){
 if(!CLOUD.ref||CLOUD.busy||!CLOUD.dirty) return;
 let json=''; try{ json=JSON.stringify(DB); }catch(e){ return; }
 CLOUD.dirty=false;
 if(json===CLOUD.last||!Object.keys(DB.players||{}).length||json.length>250000) return;
 CLOUD.busy=true;
 try{ await CLOUD.ref.set({v:1,ts:DB.ts||Date.now(),json}); CLOUD.last=json; }
 catch(e){ const c=e&&e.code; if(['invalid_argument','revoked','not_granted','capability_disabled','capability_removed','quota_exceeded','transform_error'].includes(c)) CLOUD.ref=null; else CLOUD.dirty=true; }
 CLOUD.busy=false;
 if(CLOUD.dirty&&CLOUD.ref){ clearTimeout(CLOUD.tm); CLOUD.tm=setTimeout(cloudPush,15000); }
}

 }catch(e){}

function tone(f,dur,o={}){
 if(!AU.ctx) return; if(!o.music&&!DB.settings.sfx) return;
 try{
  const c=AU.ctx, t=o.at!=null?o.at:c.currentTime+(o.when||0);
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  const v=o.vol==null?.25:o.vol;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.attack||.008)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g); g.connect(o.music?AU.mus:AU.sfx); osc.start(t); osc.stop(t+dur+.05);
 }catch(e){}
}
function noise(dur,o={}){
 if(!AU.ctx||!AU.noise) return; if(!o.music&&!DB.settings.sfx) return;
 try{
  const c=AU.ctx, t=o.at!=null?o.at:c.currentTime+(o.when||0);
  const src=c.createBufferSource(); src.buffer=AU.noise;
  const fl=c.createBiquadFilter(); fl.type=o.ftype||'bandpass'; fl.Q.value=o.q||1; fl.frequency.setValueAtTime(o.f1||1000,t); if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(o.vol==null?.2:o.vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(fl); fl.connect(g); g.connect(o.music?AU.mus:AU.sfx); src.start(t,Math.random()*.4); src.stop(t+dur+.05);
 }catch(e){}
}

function musicPlay(name,force){
 MUSIC.want=name;
 if(!AU.ctx||!DB.settings.music){ musicStop(true); return; }
 if(MUSIC.track===name&&MUSIC.timer&&!force) return;
 musicStop(true); MUSIC.track=name; MUSIC.step=0; MUSIC.next=AU.ctx.currentTime+.1;
 MUSIC.timer=setInterval(musicTick,40);
}
function musicStop(keepWant){ if(MUSIC.timer) clearInterval(MUSIC.timer); MUSIC.timer=null; MUSIC.track=null; if(!keepWant) MUSIC.want=null; }
function musicTick(){
 const tr=TRACKS[MUSIC.track]; if(!tr||!AU.ctx) return; const spb=60/tr.bpm/2, now=AU.ctx.currentTime;
 if(MUSIC.next<now-.1) MUSIC.next=now+.05;
 while(MUSIC.next<now+.2){
  const s=MUSIC.step, at=MUSIC.next;
  const m=tr.mel[s%tr.mel.length]; if(m) tone(N(m),spb*.9,{type:'square',vol:.04,at,music:true});
  const b=tr.bass[s%tr.bass.length]; if(b) tone(N(b),spb*.95,{type:'triangle',vol:.11,at,music:true});
  if(s%2===1) noise(.04,{vol:.025,f1:8000,ftype:'highpass',at,music:true});
  if(s%4===0) tone(110,.12,{type:'sine',vol:.14,slide:45,at,music:true});
  MUSIC.next+=spb; MUSIC.step++;
 }
}

 for(let i=ps.length-1;i>=0;i--){ const p=ps[i]; p.vx*=p.dr; p.vy=p.vy*p.dr+p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;

  if(p.s==='rect'){ cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillRect(-p.r,-p.r*.5,p.r*2,p.r); cx.restore(); }

function wordStat(p,w){ let n=0,c=0,b=0; for(const pre of WPRE){ const it=p.learn.items[pre+w]; if(it){ n+=it.n; c+=it.c; b=Math.max(b,it.b); } } return {n,c,b}; }

function record(skill,key,res){
 const p=me(), L=p.learn, now=Date.now();
 const isWord=WPRE.includes(key.slice(0,3)), word=isWord?key.slice(3):null;
 const wasCol=word?wordStat(p,word).c>0:true;
 const it=L.items[key]||(L.items[key]={b:0,n:0,c:0,w:0,last:0,due:0});
 const wasM=it.b>=3;
 it.n++;
 if(res===2){ it.c++; if(now>=it.due||it.b===0) it.b=Math.min(5,it.b+1); }
 else if(res===1){ it.c++; it.b=Math.max(0,it.b-1); }
 else { it.w++; it.b=0; }
 it.last=now; it.due=now+BOX_MS[it.b];
 const d=dayRec(p); d.q++; if(res===2) d.c++; (d.s[skill]=d.s[skill]||[0,0])[0]++; if(res===2) d.s[skill][1]++;
 if(SESSION){ SESSION.q++; if(res===2) SESSION.c++; (SESSION.s[skill]=SESSION.s[skill]||[0,0])[0]++; if(res===2) SESSION.s[skill][1]++; SESSION.end=now; }
 if(!wasM&&it.b>=3){ d.m.push(key); if(SESSION) SESSION.m.push(key); if(isWord) addXP(15); }
 if(word&&!wasCol&&res>0){ if(!d.nw.includes(word)) d.nw.push(word); if(SESSION&&!SESSION.nw.includes(word)) SESSION.nw.push(word); if(B&&!B.newWords.includes(word)) B.newWords.push(word); }
}

function chooseItem(cands,keyOf,idOf){
 const p=me(), L=p.learn.items, now=Date.now(); idOf=idOf||keyOf; let best=null,bs=-1e9;
 for(const c of cands){ const k=keyOf(c), it=L[k]; let s=Math.random()*3;
  if(B&&B.recent.includes(idOf(c))) s-=25;
  if(!it) s+=2.5; else { if(it.due<=now) s+=3+(5-it.b); if(it.w>it.c) s+=2; if(it.b>=4) s-=3; }

const isFem=()=>{ const p=me(); return !!p&&!!(CHARS[charOf(p)]||{}).fem; };
const FEM_PH=[['גיבור על אמיתי','גיבורת על אמיתית'],['איזה גיבור','איזו גיבורה'],['גיבור על','גיבורת על'],['גיבור-על','גיבורת-על'],['אתה יכול','את יכולה']];
const FEM_W={'בחר':'בחרי','נסה':'נסי','לחץ':'לחצי','אתה':'את','תקן':'תקני','כתוב':'כתבי','קרא':'קראי','מתח':'מתחי','איית':'אייתי','הקשב':'הקשיבי','שחרר':'שחררי','ספור':'ספרי','בוא':'בואי','פתור':'פתרי','שים':'שימי','עקוב':'עקבי','גיבור':'גיבורה','אלוף':'אלופה','מוכן':'מוכנה','תצליח':'תצליחי','תחזור':'תחזרי','גע':'געי','גרור':'גררי','בחרת':'בחרת'};
const FEM_NQ={'אַיֵּת':'אַיְּתִי','מְתַח':'מִתְחִי','כְּתֹב':'כִּתְבִי','פְּתֹר':'פִּתְרִי','הִצַּלְתָּ':'הִצַּלְתְּ','כָּתַבְתָּ':'כָּתַבְתְּ'};
function femify(t){ if(!t||!isFem()) return t; t=String(t); FEM_PH.forEach(([a,b])=>{ t=t.split(a).join(b); });
 t=t.replace(/[א-ת֑-ׇ]+/g,w=>FEM_NQ[w]||FEM_W[w]||w); return t; }

function addXP(n){
 const p=me(); if(!p) return; const before=heroLvl(p.xp); p.xp+=n; if(SESSION) SESSION.xp+=n; if(B) B.xp+=n;
 const after=heroLvl(p.xp);
 if(after>before){ const reward=15*after; p.coins+=reward; save(); setTimeout(()=>{ SFX.levelUp(); if(!$('#modal.show')) bigMsg(`🦸 רמת גיבור ${after}!`); toastQ(`🎉 עלית לרמה ${after} – ${rankName(after)}! +${reward} 🪙`,3200); confetti(90); say('עלית רמה! '+rankName(after),{queue:true}); },700); }
}
function touchStreak(p){ const t=dayKey(), y=dayKey(Date.now()-864e5); if(p.streak.last===t) return; p.streak.days=p.streak.last===y?p.streak.days+1:1; p.streak.last=t; }

function ensureQuests(p){ const t=dayKey(); if(p.quests&&p.quests.date===t&&p.quests.list.length) return; const weak=weakestSkill(p); const pool=shuffle(['win','combo','hearts','free','weak','stars3',...SKILLS.filter(s=>s!==weak)]); p.quests={date:t,bonus:false,list:[weak,...pool.slice(0,2)].map(ty=>{ const [a,b]=QT[ty].goal; return {ty,goal:rand(a,b),prog:0,done:false}; })}; save(); }
function questEvent(ty,n=1,val){ const p=me(); if(!p||!p.quests||p.quests.date!==dayKey()) return; let changed=false;
 p.quests.list.forEach(q=>{ if(q.done||q.ty!==ty) return; changed=true; if(ty==='combo') q.prog=Math.max(q.prog,val||0); else q.prog+=n;
  if(q.prog>=q.goal){ q.prog=q.goal; q.done=true; p.coins+=20; addXP(30); toastQ(`✅ משימה הושלמה! ${QT[q.ty].txt(q.goal)} • +20 🪙`,2600); SFX.unlock(); } });
 if(changed) save(); }

let MEAS=null; const WCACHE={};
function measPath(d){
 if(!MEAS){ MEAS=document.createElementNS('http://www.w3.org/2000/svg','svg'); MEAS.setAttribute('width','0'); MEAS.setAttribute('height','0'); MEAS.style.cssText='position:absolute;visibility:hidden;left:-10px;top:-10px'; MEAS.appendChild(document.createElementNS('http://www.w3.org/2000/svg','path')); document.body.appendChild(MEAS); }
 const p=MEAS.firstChild; p.setAttribute('d',d); const L=p.getTotalLength(), n=Math.max(4,Math.ceil(L/1.2)), pts=[];
 for(let i=0;i<=n;i++){ const q=p.getPointAtLength(L*i/n); pts.push({x:q.x,y:q.y}); }

}
const wStrokes=ch=>WCACHE[ch]||(WCACHE[ch]=WR[ch].map(measPath));
const INK=['#ff006e','#3a86ff','#06d6a0','#ff9f1c'];

 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; S.forEach(s=>s.pts.forEach(p=>{ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }));
 const pad=w/2+9, cxm=(x0+x1)/2, cym=(y0+y1)/2, bw=Math.max(x1-x0+2*pad,72), bh=Math.max(y1-y0+2*pad,84);
 host.innerHTML=`<div class="tracer"><svg class="trSvg" viewBox="${cxm-bw/2} ${cym-bh/2} ${bw} ${bh}" preserveAspectRatio="xMidYMid meet">

  <g class="tInk">${S.map((s,i)=>`<path d="${s.d}" stroke="${INK[i%4]}" stroke-width="${(w*.62).toFixed(2)}" stroke-dasharray="0 ${s.L+10}" style="opacity:0"/>`).join('')}</g>
  <g class="tGuide">${S.map(s=>`<path d="${s.d}"/>`).join('')}</g>

function awardCoins(n,x,y){

 for(let i=0;i<k;i++) setTimeout(()=>flyTo('<span class="coin" style="width:30px;height:30px"></span>',x+rand(-30,30),y+rand(-30,30),target,()=>{ SFX.coin(); updateCoinsHud(); }),i*70);

function spawnFloater(kind){

function collectFloater(kind,el){

}
async function victory(myB){
 myB.over=true; setBusy(true); const p=me(), li=myB.li;
 const vw=$('#villWrap'); vw.classList.add('vdead'); say(li===15?'לא! השעמום נגמר!':pick(OUCH),{pitch:.5});
 const r=vw.getBoundingClientRect(); setTimeout(()=>burst(r.left+r.width/2,r.top+r.height/2,['#ffffff','#ffd60a',myB.v.c1,myB.v.c2],90,12),550);
 musicStop(true); await sleep(1150); if(!alive(myB)) return;

 addXP(40+stars*10+(myB.v.boss?30:0));
 const newBest=score>(p.best[li]||0); if(newBest) p.best[li]=score;
 p.stars[li]=Math.max(p.stars[li]||0,stars); p.stickers[li]=Math.max(p.stickers[li]||0,stars===3?2:1);
 const prev=p.unlocked; p.unlocked=Math.max(p.unlocked,li+2); p.wins=(p.wins||0)+1; if(li===15) p.champion=true;
 if(myB.mistakes===0) p.flags.perfect=true;
 const d=dayRec(p); d.w=(d.w||0)+1; if(SESSION) SESSION.w=(SESSION.w||0)+1;
 DB.battles.push({pid:p.id,name:p.name,li,score,stars,t:Date.now()}); DB.battles.sort((a,b)=>b.score-a.score); DB.battles=DB.battles.slice(0,30);
 questEvent('win'); if(stars===3) questEvent('stars3');
 save(); checkAch();
 if(p.unlocked>prev&&(p.unlocked-1)%4===0) NEW_WORLD=true;
 say(li===15?'הצלת את העולם מהשעמום! אתה גיבור על אמיתי!':pick(['ניצחת! כל הכבוד!','איזה גיבור! ניצחת!','יש! הנבל הובס!']));
 const hlA=heroLvl(p.xp), base=xpNeed(hlA), span=xpNeed(hlA+1)-base, pctA=Math.round((p.xp-base)/span*100), pctB=hlA>hlBefore?0:Math.round((xpBefore-base)/span*100);
 const nw=myB.newWords.map(w=>WBY[w]).filter(Boolean);
 const card=showModal(`<div class="win"><div class="winTitle">${li===15?'הִצַּלְתָּ אֶת הָעוֹלָם! 👑':'נִצָּחוֹן!'}</div>
  <div class="winStars">${[0,1,2].map(i=>`<span class="ws" data-i="${i}">★</span>`).join('')}</div>
  <div class="winRows"><div>ניקוד: <b id="wScore">0</b> ${newBest?'<span class="nb">שיא חדש!</span>':''}</div><div>מטבעות בקרב: <b>${myB.coins}</b> <span class="coin sm"></span> • קומבו שיא: <b>${myB.maxCombo}</b> 🔥</div></div>
  <div class="xpRow">🦸 +${myB.xp} ניסיון <span class="xpBar"><i id="xpFill" style="width:${pctB}%"></i></span> רמה ${hlA}${hlA>hlBefore?' 🎉':''}</div>
  ${myB.ups.length?`<div class="xpRow">💎 ${[...new Set(myB.ups)].map(s=>`${stoneHTML(s,'tiny')} עלתה לרמה ${p.learn.skills[s].lvl}`).join(' • ')}</div>`:''}
  ${nw.length?`<div class="nw"><b>📒 מילים חדשות באלבום:</b><div class="chips" style="margin-top:6px">${nw.map(w=>`<button class="chip" data-act="w" data-w="${w.w}">${w.e} ${w.n}</button>`).join('')}</div></div>`:''}
  <div class="chestBox">${chestSVG()}<div class="chestHint">גע בתיבת האוצר!</div></div>
  <div class="chestReward" id="chestReward"></div>
  <div class="row" id="winBtns" style="visibility:hidden"><button class="btn gray" data-act="map">🗺️ למפה</button>${li===15?'<button class="btn green big" data-act="map">לממלכות החדשות! 🗺️</button>':'<button class="btn green big" data-act="next">לשלב הבא ⚔️</button>'}</div></div>`,'comic');
 bind(card,{map(){ SFX.click(); go('map'); }, next(){ SFX.click(); go('battle',li+1); }, w(el){ SFX.pop(); say(el.dataset.w); }});
 let opened=false;
 $('.chest',card).addEventListener('click',()=>{ if(opened) return; opened=true; openChest(card,'win'); });
 setTimeout(()=>{ const wb=$('#winBtns',card); if(wb) wb.style.visibility='visible'; },6000);

 for(let i=0;i<3;i++){ await sleep(380); const s=$(`.ws[data-i="${i}"]`,card); if(!s) return; if(i<stars){ s.classList.add('on'); SFX.star(i); const rr=s.getBoundingClientRect(); burst(rr.left+rr.width/2,rr.top+rr.height/2,['#ffd60a','#ffffff'],18,6); } else s.classList.add('off'); }
