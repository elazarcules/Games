<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0614">
<title>הרונין מניו יורק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Secular+One&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--disp:Bangers,"Secular One",Impact,sans-serif;--ink:#1b0f22;--sun:#ffd23f;--pink:#ff4fa3;--cyan:#3ff0ff;--violet:#b45cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0614;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:Rubik,system-ui,sans-serif;color:#fff}
#game{position:absolute;display:block}
#topbtns{position:absolute;display:flex;gap:6px;z-index:6;direction:ltr}
.tb{width:36px;height:36px;border-radius:11px;border:2px solid rgba(255,255,255,.28);background:rgba(15,8,28,.62);color:#fff;font:900 15px Rubik,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#btnPause{display:none}
body.playing #btnPause{display:flex}
#controls{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;direction:ltr}
body.touch.playing #controls{display:block}
.pad{position:absolute;bottom:14px}
.pad.l{left:14px;display:flex;gap:10px}
.pad.r{right:14px;width:210px;height:180px}
.b{pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);letter-spacing:0;color:#fff;background:rgba(20,10,36,.4);border:2px solid rgba(255,255,255,.38);border-radius:50%;text-shadow:0 2px 0 var(--ink);transition:transform .05s,background .05s}
.b.on{background:rgba(255,210,63,.5);transform:scale(.93);border-color:#fff}
.dir{width:80px;height:80px;font-size:30px;border-radius:22px}
.act{position:absolute;width:68px;height:68px;font-size:18px}
.act.jump{right:0;bottom:4px;width:84px;height:84px;font-size:20px;background:rgba(63,240,255,.22)}
.act.hit{right:94px;bottom:0;width:74px;height:74px;font-size:20px;background:rgba(255,79,163,.26)}
.act.roll{right:8px;bottom:100px;width:62px;height:62px;font-size:16px}
.act.sp{right:100px;bottom:88px;width:58px;height:58px;font-size:26px;opacity:.5}
.act.sp.ready{opacity:1;background:rgba(255,210,63,.55);animation:pulse .7s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 20px 5px rgba(255,210,63,.85)}}
body.portrait .pad{bottom:26px}
#tip{position:fixed;left:0;right:0;text-align:center;font-size:12px;opacity:.55;display:none;z-index:3;pointer-events:none}
body.touch.portrait.playing #tip{display:block}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;padding:14px;background:rgba(8,3,18,.66);overflow-y:auto;touch-action:pan-y;text-align:center}
.ov.show{display:flex}
#ovTitle{background:linear-gradient(rgba(8,3,18,.35),rgba(8,3,18,0) 70%);justify-content:flex-start;padding-top:7vh}
.logo{font-family:var(--disp);font-size:clamp(46px,12vmin,104px);line-height:1;letter-spacing:1px;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 30px rgba(255,79,163,.55);transform:rotate(-3deg);margin:0}
.logo span{display:block;color:var(--pink)}
.tag{font-weight:900;margin:12px 0 10px;font-size:clamp(13px,3.4vmin,19px);text-shadow:0 2px 0 var(--ink)}
.btn{font-family:var(--disp);font-size:clamp(20px,5.2vmin,30px);letter-spacing:.5px;padding:9px 28px;border-radius:14px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:#fff1d6;font-size:clamp(16px,4vmin,22px)}
.hint{font-size:12px;opacity:.85;margin-top:10px;line-height:1.55;text-shadow:0 1px 0 var(--ink)}
.hint kbd{direction:ltr;unicode-bidi:isolate;font:900 11px Rubik,sans-serif;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 5px}
h2.big{font-family:var(--disp);font-size:clamp(34px,9vmin,66px);margin:0 0 8px;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);letter-spacing:2px;line-height:1}
h2.mid{font-size:clamp(26px,6.5vmin,44px)}
.cards{display:flex;gap:10px;justify-content:center;max-width:740px;width:100%}
.card{width:min(214px,calc((100vw - 64px)/3));background:linear-gradient(#2c1544,#160a27);border:3px solid var(--ink);outline:2px solid rgba(255,255,255,.16);border-radius:16px;padding:6px 8px 9px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .12s,outline-color .12s}
.card.sel{transform:translateY(-5px);outline:3px solid var(--sun)}
.card canvas{width:100%;aspect-ratio:2/1;display:block}
.card h3{font-family:var(--disp);font-size:clamp(20px,5vmin,28px);margin:0;letter-spacing:.5px;color:var(--sun);text-shadow:0 2px 0 var(--ink)}
.card .ti{font-size:11px;opacity:.85;margin-bottom:5px}
.stat{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:900;letter-spacing:.5px;margin:2px 0}
.stat b{width:50px;text-align:start;opacity:.8}
.pips{display:flex;gap:3px;flex:1}.pips i{flex:1;height:7px;border-radius:3px;background:rgba(255,255,255,.14)}.pips i.f{background:var(--cyan)}
.spc{margin-top:5px;font-size:11px;color:var(--sun);font-weight:900}
.dsc{font-size:10px;opacity:.8;line-height:1.3;margin-top:2px}
.tally{font-weight:900;font-size:15px;min-width:250px;margin:4px 0 8px}
.tally div{display:flex;justify-content:space-between;gap:24px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.16)}
.tally .tot{font-family:var(--disp);font-size:26px;color:var(--sun);border:0;letter-spacing:1px}
.row{display:flex;flex-wrap:wrap;justify-content:center}
@media (max-height:420px){.hint{margin-top:4px;font-size:11px}.card .dsc{display:none}.tag{margin:8px 0 6px}}
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="topbtns"><button class="tb" id="btnPause" aria-label="השהיה">❚❚</button><button class="tb" id="btnMute" aria-label="צליל">♪</button></div>
<div id="tip">טיפ: סובבו את הטלפון לרוחב לתצוגה גדולה יותר</div>
<div id="controls">
  <div class="pad l"><div class="b dir" data-act="left">◀</div><div class="b dir" data-act="right">▶</div></div>
  <div class="pad r">
    <div class="b act sp" data-act="special" id="spBtn">★</div>
    <div class="b act roll" data-act="roll">גלגול</div>
    <div class="b act hit" data-act="attack">מכה</div>
    <div class="b act jump" data-act="jump">קפיצה</div>
  </div>
</div>

<div class="ov show" id="ovTitle">
  <h1 class="logo">הרונין<span>מניו יורק</span></h1>
  <div class="tag">שלושה אחים ארמדילים. ניו יורק אחת שהאורות שלה נגנבו.</div>
  <button class="btn primary" id="bPlay">שחקו!</button>
  <div class="hint" id="bestLine"></div>
</div>

<div class="ov" id="ovSelect">
  <h2 class="big mid">בחרו את הרונין שלכם</h2>
  <div class="cards" id="cards"></div>
  <div class="hint" id="ctlHint"></div>
</div>

<div class="ov" id="ovPause">
  <h2 class="big">הפסקה</h2>
  <button class="btn primary" id="bResume">המשך</button>
  <div class="row"><button class="btn alt" id="bRestart">התחלת השלב מחדש</button><button class="btn alt" id="bQuit">יציאה</button></div>
</div>

<div class="ov" id="ovClear">
  <h2 class="big">השלב הושלם!</h2>
  <div class="tally" id="clearStats"></div>
  <button class="btn primary" id="bNext">לשלב הבא ◀</button>
</div>

<div class="ov" id="ovOver">
  <h2 class="big">נוקאאוט!</h2>
  <div class="tag">מקהלת הפליז ניצחה הפעם.</div>
  <button class="btn primary" id="bCont">המשך</button>
  <button class="btn alt" id="bOverQuit">למסך הראשי</button>
</div>

<div class="ov" id="ovEnd">
  <h2 class="big">האורות חזרו!</h2>
  <div class="tag">הברון עקעק קורקע. ניו יורק זוהרת שוב.</div>
  <div class="tally" id="endStats"></div>
  <button class="btn primary" id="bAgain">שחקו שוב</button>
  <button class="btn alt" id="bEndTitle">למסך הראשי</button>
</div>

<script>
(()=>{
'use strict';
// ================= CONSTANTS & UTILS =================
const W=640,H=360,GROUND=312,GRAV=1900,OL='#1b0f22',FONT='Bangers, "Secular One", Impact, sans-serif';
const HEB=/[\u0590-\u05FF]/;const dirOf=s=>HEB.test(s)?'rtl':'ltr';
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
if(isTouch)document.body.classList.add('touch');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1));
const choose=a=>a[Math.floor(Math.random()*a.length)], sign=v=>v<0?-1:v>0?1:0;
const easeOut=k=>1-(1-k)*(1-k), TAU=Math.PI*2;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}

// ================= AUDIO =================
const AudioSys={
  ac:null,master:null,sfxG:null,musG:null,noise:null,muted:store.get('rr_muted',false),
  init(){
    try{
      if(!this.ac){
        const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
        this.ac=new AC();
        this.master=this.ac.createGain(); this.master.gain.value=this.muted?0:0.55; this.master.connect(this.ac.destination);
        this.sfxG=this.ac.createGain(); this.sfxG.gain.value=0.8; this.sfxG.connect(this.master);
        this.musG=this.ac.createGain(); this.musG.gain.value=0.2; this.musG.connect(this.master);
        const len=this.ac.sampleRate; const b=this.ac.createBuffer(1,len,this.ac.sampleRate); const d=b.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1; this.noise=b;
      }
      if(this.ac.state==='suspended')this.ac.resume();
    }catch(e){this.ac=null;}
  },
  setMuted(m){this.muted=m;store.set('rr_muted',m);if(this.master)this.master.gain.value=m?0:0.55;},
  osc(f,dur,type,vol,t,dest,slide){
    const ac=this.ac;if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(dest||this.sfxG);o.start(t);o.stop(t+dur+0.03);
  },
  tone(f,dur,type='square',vol=0.2,slide=null,delay=0){if(!this.ac)return;this.osc(f,dur,type,vol,this.ac.currentTime+delay,null,slide);},
  nz(dur,vol=0.3,freq=2000,q=1,delay=0,ftype='bandpass',dest=null,t0=null){
    const ac=this.ac;if(!ac)return;const t=t0!==null?t0:ac.currentTime+delay;
    const s=ac.createBufferSource();s.buffer=this.noise;const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f);f.connect(g);g.connect(dest||this.sfxG);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);
  },
  sfx(n){
    if(!this.ac||this.muted)return;
    try{switch(n){
      case 'hit':this.nz(0.08,0.35,1800,0.8);this.tone(190,0.08,'square',0.13,80);break;
      case 'heavy':this.nz(0.16,0.5,900,0.7);this.tone(130,0.18,'sawtooth',0.18,40);break;
      case 'whiff':this.nz(0.07,0.1,3800,2,0,'highpass');break;
      case 'jump':this.tone(300,0.12,'square',0.07,640);break;
      case 'djump':this.tone(460,0.12,'square',0.07,940);break;
      case 'roll':this.nz(0.3,0.16,600,1.5);this.tone(140,0.28,'triangle',0.14,280);break;
      case 'block':this.tone(1400,0.12,'square',0.07,900);this.tone(2100,0.2,'triangle',0.08,1800);break;
      case 'hurt':this.tone(420,0.25,'sawtooth',0.15,110);break;
      case 'die':this.nz(0.28,0.32,700,0.6);this.tone(520,0.3,'square',0.09,60);break;
      case 'bao':[523,659,784].forEach((f,i)=>this.tone(f,0.1,'square',0.08,null,i*0.06));break;
      case 'orb':this.tone(1200+Math.random()*300,0.09,'sine',0.13,1900);break;
      case 'special':[392,523,659,784,1046].forEach((f,i)=>this.tone(f,0.14,'square',0.07,null,i*0.045));this.nz(0.5,0.25,500,0.5,0.1);break;
      case 'slam':this.nz(0.5,0.6,300,0.5);this.tone(90,0.5,'sine',0.4,30);break;
      case 'break':this.nz(0.12,0.3,2500,1);this.nz(0.2,0.2,800,1,0.04);break;
      case 'boss':this.tone(80,0.9,'sawtooth',0.16,55);this.tone(83,0.9,'sawtooth',0.16,57);break;
      case 'crash':this.nz(0.9,0.7,250,0.4);this.tone(70,0.8,'sine',0.5,25);break;
      case 'clear':[523,659,784,1046,784,1046,1318].forEach((f,i)=>this.tone(f,0.16,'square',0.08,null,i*0.09));break;
      case 'select':this.tone(660,0.07,'square',0.09);this.tone(990,0.09,'square',0.09,null,0.06);break;
      case 'caw':this.tone(900,0.2,'sawtooth',0.11,500);this.tone(850,0.25,'sawtooth',0.11,450,0.22);break;
      case 'throw':this.nz(0.15,0.2,1500,1.2);this.tone(600,0.15,'triangle',0.08,300);break;
      case 'shard':this.tone(1800,0.1,'triangle',0.05,2400);break;
      case 'over':[392,330,262,196].forEach((f,i)=>this.tone(f,0.3,'triangle',0.14,null,i*0.22));break;
      case 'go':this.tone(784,0.08,'square',0.08);this.tone(1046,0.12,'square',0.08,null,0.08);break;
    }}catch(e){}
  }
};
const Music={
  on:false,step:0,next:0,timer:null,song:null,tempoMul:1,
  songs:[
    {root:45,tempo:124,bass:[0,0,null,0,3,null,5,null,0,0,null,0,-2,null,-5,null,-4,-4,null,-4,-2,null,-2,null,0,null,-5,null,-2,null,0,null],
     lead:[12,null,15,17,19,null,17,15,12,null,null,15,17,null,15,null,19,null,22,19,24,null,22,19,17,null,15,17,12,null,null,null]},
    {root:50,tempo:132,bass:[0,0,-12,0,0,null,-2,-5,-7,-7,-19,-7,-7,null,-5,-2,-4,-4,-16,-4,-4,null,-2,0,-5,null,-5,-7,-2,null,0,null],
     lead:[0,3,5,7,10,null,7,null,5,7,5,3,0,null,null,null,3,5,7,10,12,null,10,7,5,null,7,null,3,null,0,null]},
    {root:52,tempo:140,bass:[0,null,0,null,0,12,0,null,3,null,3,null,3,15,3,null,-2,null,-2,null,-2,10,-2,null,-5,null,-4,null,-2,null,-1,null],
     lead:[12,null,12,10,12,null,15,null,17,null,15,12,10,null,7,null,10,null,10,12,10,null,7,null,5,7,null,10,12,null,null,null]}
  ],
  start(i){this.stop();if(!AudioSys.ac)return;this.song=this.songs[i%this.songs.length];this.step=0;this.next=AudioSys.ac.currentTime+0.1;this.on=true;this.timer=setInterval(()=>this.tick(),25);},
  stop(){this.on=false;if(this.timer)clearInterval(this.timer);this.timer=null;},
  tick(){
    const ac=AudioSys.ac;if(!ac||!this.on||ac.state!=='running')return;
    const s=this.song,sd=60/(s.tempo*this.tempoMul)/2;
    if(this.next<ac.currentTime-0.3)this.next=ac.currentTime+0.05;
    while(this.next<ac.currentTime+0.15){this.play(this.step,this.next,sd);this.next+=sd;this.step=(this.step+1)%32;}
  },
  play(i,t,d){
    const s=this.song,A=AudioSys,dest=A.musG,mf=m=>440*Math.pow(2,(m-69)/12);
    try{
      const b=s.bass[i];if(b!==null)A.osc(mf(s.root+b),d*0.9,'triangle',0.5,t,dest);
      const l=s.lead[i];if(l!==null)A.osc(mf(s.root+12+l),d*0.85,'square',0.1,t,dest);
      if(i%8===0||i%8===5)A.osc(150,0.12,'sine',0.55,t,dest,40);
      if(i%8===4)A.nz(0.1,0.22,1800,0.7,0,'bandpass',dest,t);
      if(i%2===1)A.nz(0.03,0.07,8000,1,0,'highpass',dest,t);
    }catch(e){}
  }
};

// ================= INPUT =================
const input={left:false,right:false,down:false,jump:false,attack:false,roll:false,special:false};
const buf={jump:0,attack:0,roll:0,special:0};
const keys=new Set(),touchHeld=new Set();
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'attack',KeyZ:'attack',KeyK:'roll',KeyX:'roll',ShiftLeft:'roll',ShiftRight:'roll',KeyL:'special',KeyC:'special'};
function press(a){if(a in buf)buf[a]=0.16;}
function refreshHeld(){for(const k in input)input[k]=false;for(const c of keys){const a=KEYMAP[c];if(a)input[a]=true;}for(const a of touchHeld)input[a]=true;}
addEventListener('keydown',e=>{
  if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){if(mode==='play'){setPaused(!paused);}e.preventDefault();return;}
  if(mode==='select'&&!e.repeat&&!document.querySelector('.ov.show:not(#ovSelect)')){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){selIdx=(selIdx+1)%3;markSel();AudioSys.sfx('select');e.preventDefault();return;}
    if(e.code==='ArrowRight'||e.code==='KeyD'){selIdx=(selIdx+2)%3;markSel();AudioSys.sfx('select');e.preventDefault();return;}
    if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3'){startRun(CH_ORDER[+e.code.slice(5)-1]);e.preventDefault();return;}
    if(e.code==='Enter'||e.code==='Space'){startRun(CH_ORDER[selIdx]);e.preventDefault();return;}
  }
  if(e.code==='Enter'&&!e.repeat){
    const ae=document.activeElement;
    if(ae&&ae.tagName==='BUTTON'&&ae.closest('.ov.show'))return;
    const pb=document.querySelector('.ov.show .primary');if(pb){pb.click();e.preventDefault();return;}
  }
  const a=KEYMAP[e.code];
  if(a){e.preventDefault();if(!keys.has(e.code)){keys.add(e.code);press(a);}}
});
addEventListener('keyup',e=>{keys.delete(e.code);});
addEventListener('blur',()=>{keys.clear();});

const pointers=new Map();let btnRects=[];
function cacheButtons(){btnRects=[...document.querySelectorAll('#controls [data-act]')].map(el=>({el,act:el.dataset.act,r:el.getBoundingClientRect()}));}
function updateTouch(){
  const prev=new Set(touchHeld);touchHeld.clear();
  for(const p of pointers.values()){
    let best=null,bd=1e9;
    for(const b of btnRects){const r=b.r;if(!r.width)continue;const pad=12;
      if(p.x>=r.left-pad&&p.x<=r.right+pad&&p.y>=r.top-pad&&p.y<=r.bottom+pad){const cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2,d=(p.x-cx)**2+(p.y-cy)**2;if(d<bd){bd=d;best=b;}}}
    if(best)touchHeld.add(best.act);
  }
  for(const a of touchHeld)if(!prev.has(a))press(a);
  for(const b of btnRects)b.el.classList.toggle('on',touchHeld.has(b.act));
}
const ctlEl=document.getElementById('controls');
ctlEl.addEventListener('pointerdown',e=>{e.preventDefault();if(!btnRects.length||!btnRects[0].r.width)cacheButtons();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});updateTouch();AudioSys.init();});
addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});updateTouch();}});
const endPtr=e=>{if(pointers.delete(e.pointerId))updateTouch();};
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
ctlEl.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
ctlEl.addEventListener('contextmenu',e=>e.preventDefault());

function limb(g,x1,y1,x2,y2,w,col){g.lineCap='round';g.strokeStyle=OL;g.lineWidth=w+2.6;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}

function gearPath(g,cx,cy,r,teeth,rot){g.beginPath();const n=teeth*2;for(let i=0;i<n;i++){const a0=rot+i/n*TAU,a1=rot+(i+1)/n*TAU,rad=i%2?r*0.76:r;g.lineTo(cx+Math.cos(a0)*rad,cy+Math.sin(a0)*rad);g.lineTo(cx+Math.cos(a1)*rad,cy+Math.sin(a1)*rad);}g.closePath();}
function starPath(g,x,y,r1,r2,n,rot=0){g.beginPath();for(let i=0;i<n*2;i++){const a=rot+i/(n*2)*TAU-Math.PI/2,r=i%2?r2:r1;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();}
function otext(g,str,x,y,size,fill,align='center',lw){str=String(str);g.direction=dirOf(str);g.font=`${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';g.lineJoin='round';g.lineWidth=lw||Math.max(3,size*0.2);g.strokeStyle=OL;g.strokeText(str,x,y);g.fillStyle=fill;g.fillText(str,x,y);}

function updateParts(dt){
  for(const p of parts){p.life-=dt;if(p.g)p.vy+=p.g*dt;if(p.drag){const k=Math.max(0,1-p.drag*dt);p.vx*=k;p.vy*=k;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;
    if((p.t==='gear'||p.t==='bamboo'||p.t==='dumpling')&&p.y>GROUND){p.y=GROUND;p.vy*=-0.42;p.vx*=0.7;p.vr*=0.7;}}
  parts=parts.filter(p=>p.life>0);
}
function drawParts(g){
  for(const p of parts){const k=clamp(p.life/p.max,0,1);g.globalAlpha=1;
    switch(p.t){
      case 'spark':g.globalAlpha=k;g.strokeStyle=p.col;g.lineWidth=p.size;g.lineCap='round';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*0.035,p.y-p.vy*0.035);g.stroke();break;
      case 'flash':g.globalAlpha=k;g.fillStyle='#fff';starPath(g,p.x,p.y,p.size,p.size*0.38,8,p.rot);g.fill();break;
      case 'dust':g.globalAlpha=k*0.55;g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.size*(1.7-k),0,TAU);g.fill();break;
      case 'steam':g.globalAlpha=k*0.32;g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,p.size*(2.2-k),0,TAU);g.fill();break;
      case 'gear':g.globalAlpha=Math.min(1,k*3);g.fillStyle=p.col;gearPath(g,p.x,p.y,p.size,6,p.rot);g.fill();g.lineWidth=1.2;g.strokeStyle=OL;g.stroke();break;
      case 'conf':g.globalAlpha=Math.min(1,k*2);g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.fillRect(-3.5,-1.6,7,3.2);g.restore();break;
      case 'ring':g.globalAlpha=k;g.strokeStyle=p.col;g.lineWidth=3*k+1;{const r=p.size*(1-k)+4;g.beginPath();g.ellipse(p.x,p.y,r,Math.max(1,r*p.flat),0,0,TAU);g.stroke();}break;
      case 'text':g.globalAlpha=Math.min(1,k*2);otext(g,p.str,p.x,p.y,p.size,p.col);break;
      case 'bamboo':g.globalAlpha=Math.min(1,k*3);g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle='#d9b064';g.fillRect(-6,-2,12,4);g.lineWidth=1;g.strokeStyle=OL;g.strokeRect(-6,-2,12,4);g.restore();break;
      case 'dumpling':g.globalAlpha=Math.min(1,k*3);g.save();g.translate(p.x,p.y);g.rotate(p.rot);drawDumpling(g,0,8,p.size);g.restore();break;
      case 'comic':{const age=1-k,sc=age<0.12?lerp(0.3,1.25,age/0.12):lerp(1.25,1,Math.min(1,(age-0.12)/0.15));g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.scale(sc,sc);g.globalAlpha=Math.min(1,k*3);
        g.font=`${p.size}px ${FONT}`;const w=g.measureText(p.str).width;g.fillStyle=p.bg;starPath(g,0,0,w*0.62+8,w*0.44+4,11);g.fill();g.lineWidth=2.5;g.strokeStyle=OL;g.stroke();otext(g,p.str,0,1,p.size,'#fff');g.restore();}break;
    }}
  g.globalAlpha=1;
}

function loadStage(i){
  const def=STAGES[i];G.stageIdx=i;G.stageStartScore=G.score;G.stageTime=0;G.stageMaxCombo=0;G.kills=0;G.combo=0;G.comboT=0;
  S={def,i,len:def.len,plats:def.plats.map(([x,y,w])=>({x,y,w})),arenas:def.arenas.map(a=>({x:a.x,waves:a.waves,state:'wait',wave:-1,queue:[],qT:0,delay:0.3})),
     bossArena:{x:def.len-W,boss:true,state:'wait'},cur:null,lockX:null,goT:0,bannerT:3.4,boss:null,bossSpawnT:0,cardT:0,hpMul:1+i*0.18,dmgMul:1+i*0.15,tower:null,victoryT:0,overlayShown:false,hurtFlash:0,spFlash:0};
  enemies=[];projs=[];hazards=[];pickups=[];breakables=[];parts=[];
  for(const s of def.steamers)breakables.push({x:s[0],y:s[1]==null?GROUND:s[1],n:s[2]?3:2,basket:!!s[2],broken:false});
  for(const[t,x,y]of def.items)pickups.push(makePickup(t,x,y,true));
  for(const[t,x]of def.foes){const e=makeEnemy(t,x,t==='bird'?205:GROUND);e.dormant=true;if(t!=='bird')e.onGround=true;enemies.push(e);}
  player=makePlayer(G.charId,player?player.glow:0);camX=0;shakeMag=0;freezeT=0;slowT=0;
  ensureLayers(def.theme);Music.tempoMul=1;Music.start(i);mode='play';paused=false;hideOv();
}
function startRun(id){AudioSys.init();AudioSys.sfx('select');G={charId:id,score:0,lives:3,stageIdx:0,stageStartScore:0,combo:0,comboT:0,maxCombo:0,stageMaxCombo:0,kills:0,stageTime:0};player=null;loadStage(0);}
function spawnFoe(type,side,arena){
  const L=lockL();let x,y=GROUND;if(type==='bird'||side==='T'){x=L+rand(90,W-90);y=40;}else if(side==='L')x=L-30;else x=L+W+30;
  const e=makeEnemy(type,x,y);e.face=side==='L'?1:-1;e.arena=arena||null;if(type!=='bird')e.onGround=true;enemies.push(e);return e;
}
function updateArenas(dt){
  const p=player;
  if(S.lockX===null){
    for(const a of S.arenas){if(a.state==='wait'&&camX>=a.x-1&&p.x>a.x+W*0.35){a.state='active';S.lockX=a.x;S.cur=a;a.delay=0.25;break;}}
    const ba=S.bossArena;if(S.lockX===null&&ba.state==='wait'&&p.x>ba.x+W*0.48){ba.state='active';S.lockX=ba.x;S.cur=ba;S.cardT=2.8;S.bossSpawnT=1.1;Music.tempoMul=1.12;}
  }
  const a=S.cur;if(!a)return;
  if(a.boss){if(S.bossSpawnT>0){S.bossSpawnT-=dt;if(S.bossSpawnT<=0)spawnBoss();}return;}
  if(a.queue.length){a.qT-=dt;if(a.qT<=0){const[t,side]=a.queue.shift();spawnFoe(t,side,a);a.qT=0.45;}return;}
  if(!enemies.some(e=>e.arena===a&&!e.dead)){a.delay-=dt;if(a.delay<=0){a.wave++;
    if(a.wave<a.waves.length){a.queue=a.waves[a.wave].map(s=>s.split(':'));a.qT=0;a.delay=0.9;}
    else{a.state='done';S.lockX=null;S.cur=null;S.goT=3.5;AudioSys.sfx('go');}}}
}
function spawnBoss(){
  const t=S.def.boss,mag=t==='magpie';const e=makeEnemy(t,mag?S.lockX+W+80:S.lockX+W*0.72,mag?90:-170);
  e.state='enter';e.stateT=0;e.face=-1;e.onGround=false;e.landed=false;enemies.push(e);S.boss=e;AudioSys.sfx(mag?'caw':'boss');
}
function killBoss(e){
  e.dead=true;e.deadT=0;e.vx=0;slowT=1.1;shake(14);G.score+=e.f.score;Music.stop();AudioSys.sfx('crash');player.invuln=6;
  addComic(e.x,e.y-e.h-14,'נוקאאוט!','#ff4fa3',30);for(const o of enemies)if(o!==e&&!o.dead)killEnemy(o,0,true);

function updateVictory(dt){

  if(S.victoryT>0.6&&!T.landed){T.vy+=1600*dt;T.y+=T.vy*dt;if(T.y>=GROUND){T.y=GROUND;T.landed=true;T.landT=S.victoryT;T.squash=1;shake(18);AudioSys.sfx('crash');

const fmtTime=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');};

// ================= COMBAT =================
function hitEnemy(e,dmg,kbx,kby,o={}){
  if(e.dead||e.invulT>0)return false;e.dormant=false;
  const dir=o.dir!==undefined?o.dir:sign(e.x-player.x)||1;const fromFront=-dir===e.face;
  if(e.type==='shield'&&!o.breakGuard&&e.guardT<=0&&fromFront&&e.state!=='hurt'&&e.state!=='down'&&e.stunT<=0){
    e.vx=-e.face*90;sparks(e.x+e.face*16,e.y-30,5,'#cfe3ff');AudioSys.sfx('block');addText(e.x,e.y-64,'קלאנג!','#cfe3ff',14);return 'block';}
  if(e.type==='shield'&&o.breakGuard&&e.guardT<=0){e.guardT=3.2;addText(e.x,e.y-66,'המגן נשבר!','#ffd23f',14);}
  let d=dmg;if(e.state==='stunned'||(e.type==='magpie'&&e.state==='perch'))d=Math.round(d*1.5);
  e.hp-=d;e.flash=0.12;G.combo++;G.comboT=1.6;if(G.combo>G.maxCombo)G.maxCombo=G.combo;if(G.combo>G.stageMaxCombo)G.stageMaxCombo=G.combo;G.score+=10;
  if(!o.noGlow)player.glow=Math.min(100,player.glow+5);
  const hy=e.y-e.h*0.55;sparks(e.x-dir*e.hw*0.4,hy,o.heavy?9:6);freezeT=Math.max(freezeT,o.heavy?0.07:0.04);shake(o.heavy?6:3);AudioSys.sfx(o.heavy?'heavy':'hit');
  if(e.f.boss){e.x+=dir*3;if(e.hp<=0)killBoss(e);return 'hit';}
  if(o.stun)e.stunT=Math.max(e.stunT,o.stun);
  if(e.f.fly){e.state='hurt';e.stateT=0;e.hurtDur=o.knock?0.55:0.3;e.vx=kbx;e.vy=(kby||-60)*0.6;}
  else{e.state='hurt';e.stateT=0;e.knock=!!o.knock;e.hurtDur=0.28;e.vx=kbx;if(o.knock){e.vy=Math.min(kby,-280);e.onGround=false;e.bowled=new Set();}else if(kby)e.vy=kby;}
  if(e.hp<=0)killEnemy(e,kbx);
  return 'hit';
}
function killEnemy(e,kbx,silent){
  e.dead=true;e.deadT=0;e.vx=kbx?kbx*1.2:rand(-100,100);e.vy=-340;e.onGround=false;
  if(!silent){G.score+=e.f.score;G.kills++;}
}
function explodeEnemy(e,silent){
  gears(e.x,e.y-e.h*0.5,9);sparks(e.x,e.y-e.h*0.5,6,'#c77dff');if(!silent)AudioSys.sfx('die');
  if(!silent&&mode==='play'){const lowHp=player.hp<player.maxHp*0.4;if(Math.random()<(lowHp?0.35:0.18))pickups.push(makePickup('bao',e.x,Math.min(e.y,GROUND)-20,false));
    const n=Math.random()<0.75?randi(1,2):0;for(let i=0;i<n;i++)pickups.push(makePickup('orb',e.x+rand(-10,10),Math.min(e.y,GROUND)-24,false));}
}
function hurtPlayer(dmg,srcX,kbMul=1){
  const p=player;if(mode!=='play'||p.invuln>0||p.state==='dead'||(p.state==='roll'&&p.stateT<0.3)||p.state==='special')return false;
  p.hp-=dmg;G.combo=0;G.comboT=0;const d=sign(p.x-srcX)||-p.face;
  p.vx=d*210*kbMul;p.vy=-250;p.onGround=false;p.state='hurt';p.stateT=0;p.invuln=1.0;shake(6);S.hurtFlash=0.25;AudioSys.sfx('hurt');sparks(p.x,p.y-26,5,'#ff8a8a');
  if(p.hp<=0){p.hp=0;p.state='dead';p.stateT=0;p.respawnT=1.7;p.vy=-380;p.vx=d*170;}
  return true;
}
function respawn(){
  const p=player;G.lives--;
  if(G.lives>0){p.hp=p.maxHp;p.state='jump';p.y=50;p.vy=0;p.vx=0;p.invuln=2.6;const L=lockL();p.x=clamp(p.x,L+60,L+W-60);
    for(const e of enemies)if(!e.dead&&!e.f.boss&&Math.abs(e.x-p.x)<170)e.vx=sign(e.x-p.x||1)*320;ring(p.x,GROUND,'#ffd23f',90);}
  else gameOver();
}
function playerStrike(box,dmg,kbx,kby,o){
  const p=player;let any=false;
  for(const e of enemies){if(e.dead||p.hitSet.has(e))continue;if(overlap(box,ebox(e))){p.hitSet.add(e);const r=hitEnemy(e,dmg,kbx,kby,o);if(r==='block'){p.vx=-p.face*140;}if(r)any=r;}}
  for(const b of breakables){if(!b.broken&&!p.hitSet.has(b)&&overlap(box,bbox(b))){p.hitSet.add(b);breakSteamer(b);any=any||'hit';}}
  return any;
}
function breakSteamer(b){
  b.broken=true;AudioSys.sfx('break');steam(b.x,b.y-20,8);for(let i=0;i<7;i++)addPart({t:'bamboo',x:b.x,y:b.y-14,vx:rand(-200,200),vy:rand(-380,-140),g:1300,life:1.2,max:1.2,rot:rand(0,TAU),vr:rand(-12,12)});
  if(b.basket)pickups.push(makePickup('basket',b.x,b.y-20,false));
  else if(Math.random()<0.65)pickups.push(makePickup('bao',b.x,b.y-20,false));
  else for(let i=0;i<3;i++)pickups.push(makePickup('orb',b.x,b.y-24,false));
  G.score+=25;

function atkBox(p,reach,top,bot){const s=p.c.size,x0=p.face>0?p.x+6*s:p.x-(6+reach)*s;return{x:x0,y:p.y-top*s,w:reach*s,h:(top-bot)*s};}

// ================= PLAYER =================
function doJump(p,mul){p.vy=-p.c.jump*mul;p.onGround=false;p.coyote=0;AudioSys.sfx('jump');dust(p.x,p.y,3);}
function startAttack(p,chain){
  p.hitSet.clear();AudioSys.sfx('whiff');
  if(!p.onGround){p.state='airkick';p.stateT=0;return;}
  if(chain)p.combo++;else p.combo=(gTime-p.lastAtkEnd<0.32&&p.combo>0&&p.combo<3)?p.combo+1:1;
  p.state='attack';p.stateT=0;p.comboQueued=false;p.bolaThrown=false;
}
function startRoll(p){if(input.left)p.face=-1;if(input.right)p.face=1;p.state='roll';p.stateT=0;p.hitSet.clear();AudioSys.sfx('roll');}
function startSpecial(p){
  p.glow=0;p.state='special';p.stateT=0;p.hitSet.clear();p.sp={phase:'',hitT:new Map(),thrown:false};AudioSys.sfx('special');shake(4);S.spFlash=0.3;
  addComic(p.x,p.y-118,SPECIAL_WORD[p.id],'#3ff0ff',22);
  if(p.id==='dusty'){if(p.onGround){p.sp.phase='rise';p.vy=-560;p.onGround=false;}else{p.sp.phase='dive';p.vy=950;}}
  else if(p.id==='pip'){p.vy=-340;p.onGround=false;p.vx=p.face*640;}
  else p.vx=0;

function quake(p){
  shake(16);AudioSys.sfx('slam');ring(p.x,GROUND,'#ffd23f',180,0.22);ring(p.x,GROUND,'#fff',120,0.22);dust(p.x-40,p.y,10);dust(p.x+40,p.y,10);
  for(let i=0;i<10;i++)addPart({t:'gear',x:p.x+rand(-60,60),y:p.y,vx:rand(-200,200),vy:rand(-500,-200),g:1300,life:1,max:1,size:rand(2,4),rot:0,vr:5,col:'#8a6a5a'});
  for(const e of enemies){if(e.dead)continue;const dx=e.x-p.x;if(Math.abs(dx)<180&&e.y>p.y-180)hitEnemy(e,34,sign(dx||1)*300,-400,{knock:true,breakGuard:true,noGlow:true,heavy:true,dir:sign(dx||1)});}
  for(const b of breakables)if(!b.broken&&Math.abs(b.x-p.x)<180)breakSteamer(b);
}
function updSpecial(p,dt){
  if(p.id==='dusty'){
    p.vx=approach(p.vx,0,600*dt);p.rollAng+=p.face*dt*18;

    if(p.stateT>1.8){p.state='jump';p.vx*=0.3;}

function updatePlayer(dt){
  const p=player,c=p.c,s=c.size;p.animT+=dt;p.stateT+=dt;
  if(p.invuln>0)p.invuln-=dt;if(p.rollCD>0)p.rollCD-=dt;if(p.dropT>0)p.dropT-=dt;if(p.coyote>0)p.coyote-=dt;
  const wasGround=p.onGround;
  if(mode==='victory'){p.vx=approach(p.vx,0,900*dt);if(S.tower)p.face=sign(S.tower.x-p.x)||1;if(p.state!=='victory'&&p.onGround)p.state='victory';if(S.tower&&S.tower.landed&&p.onGround&&Math.random()<0.04){p.vy=-420;p.onGround=false;}if(!p.onGround)p.state='victory';physBody(p,dt);return;}

  const mv=(input.right?1:0)-(input.left?1:0);

    if(p.state==='idle'||p.state==='run'||p.state==='jump')p.state=p.onGround?(Math.abs(p.vx)>25?'run':'idle'):'jump';
  }else if(p.state==='attack'){

    if(t>=A.a0&&t<=A.a1){const box=atkBox(p,A.reach,A.top,A.bot);const r=playerStrike(box,Math.round(c.dmg*A.mul),p.face*A.kb*c.kb,A.kby,{knock:A.knock,heavy:A.knock,dir:p.face});if(r==='hit'&&A.knock)addComic(box.x+box.w/2+p.face*14,box.y-34,choose(COMIC),'#ffd23f',19);}
    if(p.id==='mesa'&&p.combo===3&&t>=0.12&&!p.bolaThrown){p.bolaThrown=true;AudioSys.sfx('throw');projs.push({kind:'bola',owner:'p',x:p.x+p.face*18,y:p.y-28,vx:p.face*430,vy:0,life:0.5,r:9,dmg:Math.round(c.dmg*0.8),hit:new Set(),rot:0,stun:0.9});}
    if(buf.roll>0&&t>A.a1&&p.rollCD<=0){buf.roll=0;startRoll(p);}
    else if(buf.special>0&&p.glow>=100){buf.special=0;startSpecial(p);}
    else if(t>=A.dur){if(p.comboQueued&&p.combo<3)startAttack(p,true);else{p.state='idle';p.lastAtkEnd=gTime;if(p.combo>=3)p.combo=0;}}
  }else if(p.state==='airkick'){

    if(p.onGround||p.stateT>0.5)p.state=p.onGround?'idle':'jump';
  }else if(p.state==='roll'){
    p.vx=p.face*c.roll*(p.stateT<0.32?1:0.55);p.rollAng+=p.face*dt*22;
    playerStrike({x:p.x-17*s,y:p.y-34*s,w:34*s,h:34*s},Math.round(c.dmg*1.1),p.face*300*c.kb,-260,{knock:true,breakGuard:true,dir:p.face});

  }else if(p.state==='hurt'){

// ================= ENEMY AI =================
function updateEnemy(e,dt){
  e.animT+=dt;e.stateT+=dt;if(e.flash>0)e.flash-=dt;if(e.invulT>0)e.invulT-=dt;if(e.hopCD>0)e.hopCD-=dt;if(e.guardT>0)e.guardT-=dt;if(e.sumCD>0)e.sumCD-=dt;
  if(e.dormant){if(e.x<camX+W+20&&e.x>camX-20)e.dormant=false;else return;}
  if(e.dead){
    e.deadT+=dt;
    if(e.f.boss){if(e.f.fly)e.y=Math.min(GROUND,e.y+160*dt);else physBody(e,dt);e.vx=0;
      if(Math.random()<0.35){gears(e.x+rand(-30,30),e.y-rand(10,e.h),2);if(Math.random()<0.5)sparks(e.x+rand(-30,30),e.y-rand(10,e.h),4,'#c77dff');}
      if(e.deadT>1.4&&!e.remove){e.remove=true;gears(e.x,e.y-e.h/2,24);confetti(e.x,e.y-e.h/2,20);shake(12);startVictory();}return;}
    physBody(e,dt);if(e.deadT>0.6){e.remove=true;explodeEnemy(e,mode!=='play');}return;
  }
  if(e.type==='tinker'||e.type==='shield')updWalker(e,dt);else if(e.type==='bird')updBird(e,dt);else if(e.type==='magpie')updMagpie(e,dt);else updGear(e,dt);
  if(S.lockX!==null&&!e.f.boss){if(e.entered)e.x=clamp(e.x,S.lockX+e.hw,S.lockX+W-e.hw);else if(e.x>S.lockX+e.hw&&e.x<S.lockX+W-e.hw)e.entered=true;}
}
const edmg=d=>Math.round(d*S.dmgMul);
function updWalker(e,dt){
  const p=player,dx=p.x-e.x,adx=Math.abs(dx),dy=p.y-e.y,alive=p.state!=='dead'&&mode==='play';
  if(e.state==='hurt'){

    if(e.knock&&!e.onGround&&Math.abs(e.vx)>170&&e.bowled){for(const o of enemies){if(o===e||o.dead||o.f.fly||o.f.boss||e.bowled.has(o))continue;if(overlap(ebox(e),ebox(o))){e.bowled.add(o);hitEnemy(o,7,sign(e.vx)*230,-220,{knock:true,breakGuard:true,dir:sign(e.vx)});}}}
    if(e.knock){if(e.onGround&&e.stateT>0.12){e.state='down';e.stateT=0;e.invulT=0.75;e.vx=0;dust(e.x,e.y,4);}}
    else if(e.stateT>e.hurtDur)e.state='walk';
  }else if(e.state==='down'){e.vx=approach(e.vx,0,800*dt);if(e.stateT>0.75){e.state='walk';e.cd=rand(0.3,0.8);}}
  else if(e.stunT>0){e.stunT-=dt;e.vx=approach(e.vx,0,600*dt);if(e.state!=='walk')e.state='walk';}
  else if(e.state==='walk'){
    if(alive)e.face=dx<0?-1:1;let want=alive&&adx>40?e.face*e.f.speed:0;
    for(const o of enemies){if(o===e||o.dead||o.f.fly||o.f.boss||o.dormant)continue;const ox=o.x-e.x;if(Math.abs(ox)<26&&Math.abs(o.y-e.y)<20){if(sign(ox)===e.face)want*=0.15;e.x-=(sign(ox)||1)*22*dt;}}
    e.vx=approach(e.vx,want,700*dt);if(e.cd>0)e.cd-=dt;
    if(alive&&adx<50&&Math.abs(dy)<36&&e.cd<=0){e.state='windup';e.stateT=0;}
    if(alive&&e.onGround&&dy<-46&&adx<120&&e.hopCD<=0){e.vy=-600;e.hopCD=rand(1.8,3);e.vx=e.face*100;e.onGround=false;}
  }else if(e.state==='windup'){e.vx=approach(e.vx,0,900*dt);if(e.stateT>(e.type==='shield'?0.5:0.42)){e.state='punch';e.stateT=0;e.hitP=false;}}
  else if(e.state==='punch'){
    e.vx=e.stateT<0.1?e.face*(e.type==='shield'?140:90):approach(e.vx,0,900*dt);
    if(!e.hitP&&e.stateT<0.16&&alive){const box={x:e.face>0?e.x:e.x-46,y:e.y-44,w:46,h:32};if(overlap(box,pbox())){e.hitP=true;hurtPlayer(edmg(e.f.dmg),e.x);}}
    if(e.stateT>0.36){e.state='walk';e.cd=rand(0.8,1.7);}
  }
  physBody(e,dt);
}
function updBird(e,dt){

  else if(e.stunT>0){e.stunT-=dt;e.vx=approach(e.vx,0,300*dt);e.vy=e.y<GROUND-2?140:0;}
  else if(e.state==='hover'||e.state==='walk'){

    e.vx=approach(e.vx,clamp((tx-e.x)*2,-e.f.speed,e.f.speed),320*dt);e.vy=approach(e.vy,clamp((ty-e.y)*2.2,-140,140),340*dt);e.face=p.x<e.x?-1:1;
    e.cd-=dt;if(e.cd<=0&&alive&&Math.abs(p.x-e.x)<260){e.state='aim';e.stateT=0;}

function updGear(e,dt){

    case 'enter':physBody(e,dt);if(e.onGround&&!e.landed){e.landed=true;shake(16);AudioSys.sfx('crash');dust(e.x-30,GROUND,10);dust(e.x+30,GROUND,10);}if(e.landed&&e.stateT>1.3){e.state='idle';e.stateT=0;e.wait=0.5;}return;

    case 'walk':e.face=dx<0?-1:1;e.vx=approach(e.vx,e.face*spd,400*dt);if(adx<95){e.state='windup';e.stateT=0;e.vx=0;}else if(e.stateT>1.6)gearChoose(e);break;
    case 'windup':e.vx=approach(e.vx,0,900*dt);if(e.stateT>(e.phase2?0.42:0.55)){e.state='punch';e.stateT=0;e.hitP=false;AudioSys.sfx('whiff');}break;
    case 'punch':e.vx=e.stateT<0.12?e.face*170:approach(e.vx,0,900*dt);
      if(!e.hitP&&e.stateT<0.2&&alive){const box={x:e.face>0?e.x+10:e.x-100,y:e.y-104,w:90,h:70};if(overlap(box,pbox())){e.hitP=true;hurtPlayer(edmg(e.f.dmg),e.x,1.5);}}

    case 'chargeWind':e.vx=0;if(e.stateT>(e.phase2?0.55:0.75)){e.state='charge';e.stateT=0;e.hitP=false;AudioSys.sfx('roll');}break;
    case 'charge':e.vx=e.face*(mk2?480:420);if(!e.hitP&&alive&&overlap(ebox(e),pbox())){e.hitP=true;hurtPlayer(edmg(20),e.x,1.8);}if(Math.random()<0.6)dust(e.x-e.face*30,GROUND,1);
      if((e.face>0&&e.x>=R-2)||(e.face<0&&e.x<=L+2)){e.state='stunned';e.stateT=0;e.vx=-e.face*120;shake(12);AudioSys.sfx('slam');sparks(e.x+e.face*40,e.y-70,10);e.charges--;}
      else if(e.stateT>2.2){e.state='idle';e.stateT=0;}break;
    case 'stunned':e.vx=approach(e.vx,0,400*dt);if(e.stateT>(e.phase2?1.0:1.5)){if(e.charges>0){e.face=dx<0?-1:1;e.state='chargeWind';e.stateT=0.3;}else{e.state='idle';e.stateT=0;e.wait=0.5;}}break;
    case 'leap':if(e.onGround&&e.stateT>0.15){shake(13);AudioSys.sfx('slam');dust(e.x-30,GROUND,8);dust(e.x+30,GROUND,8);
        for(const d of[-1,1])hazards.push({x:e.x+d*40,dir:d,speed:e.phase2?360:300,life:1.8,dmg:edmg(14),hit:false});e.state='idle';e.stateT=0;e.wait=0.8;e.vx=0;}break;
    case 'summon':e.vx=0;if(e.stateT>0.35&&!e.summoned){e.summoned=true;AudioSys.sfx('boss');spawnFoe('tinker','L',null);spawnFoe(mk2?'shield':'tinker','R',null);addText(e.x,e.y-150,'תגבורת!','#c77dff',16);}

function gearChoose(e){

function updateProjs(dt){
  const pb=player?pbox():null;
  for(const b of projs){b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=dt*18;const box={x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2};

      for(const e of enemies){if(e.dead||b.hit.has(e))continue;if(overlap(box,ebox(e))){b.hit.add(e);hitEnemy(e,b.dmg,sign(b.vx)*120,-120,{stun:b.stun,noGlow:b.big,breakGuard:b.big,dir:sign(b.vx)});}}
      for(const k of breakables)if(!k.broken&&overlap(box,bbox(k)))breakSteamer(k);}
    else{if(mode==='play'&&overlap(box,pb)&&hurtPlayer(b.dmg,b.x))b.life=0;if(b.y>=GROUND-3){b.life=0;sparks(b.x,GROUND-3,3,'#e7c8ff');}}}
  projs=projs.filter(b=>b.life>0&&b.x>camX-120&&b.x<camX+W+120);

function updateHazards(dt){

    if(!h.hit&&overlap({x:h.x-14,y:GROUND-26,w:28,h:26},pb)&&hurtPlayer(h.dmg,h.x-h.dir*20))h.hit=true;
    if(S.lockX!==null&&(h.x<S.lockX||h.x>S.lockX+W))h.life=0;}

function updatePickups(dt){

// ================= CAMERA / MAIN UPDATE =================
function updateCamera(dt){
  const p=player;if(S.lockX!==null)camX=approach(camX,S.lockX,520*dt);

function update(dt){

  if(!S||paused)return;
  shakeMag=approach(shakeMag,0,40*dt);
  if(mode==='gameover'){updateParts(dt);for(const e of enemies)if(e.dead)updateEnemy(e,dt);return;}
  if(freezeT>0){freezeT-=dt;return;}
  let d=dt;if(slowT>0){slowT-=dt;d*=0.35;}
  if(mode==='play')G.stageTime+=d;
  if(S.bannerT>0)S.bannerT-=dt;if(S.cardT>0)S.cardT-=dt;if(S.goT>0)S.goT-=dt;if(S.hurtFlash>0)S.hurtFlash-=dt;if(S.spFlash>0)S.spFlash-=dt;
  if(G.comboT>0){G.comboT-=d;if(G.comboT<=0)G.combo=0;}
  updatePlayer(d);if(mode==='play')updateArenas(d);
  for(const e of enemies)updateEnemy(e,d);enemies=enemies.filter(e=>!e.remove);

}

function hideOv(){showOv(null);}
function updateBodyState(){const any=ovs.some(o=>o.classList.contains('show'));document.body.classList.toggle('playing',(mode==='play'||mode==='victory')&&!paused&&!any);requestAnimationFrame(cacheButtons);if(!document.body.classList.contains('playing')){touchHeld.clear();pointers.clear();}}
function setPaused(b){if(mode!=='play')return;paused=b;if(b){showOv('ovPause');try{AudioSys.ac&&AudioSys.ac.suspend();}catch(e){}}else{hideOv();try{AudioSys.ac&&AudioSys.ac.resume();}catch(e){}}}
function toTitle(){mode='title';paused=false;S=null;Music.stop();try{AudioSys.ac&&AudioSys.ac.resume();}catch(e){}parts=[];ensureLayers('warm');updateBest();showOv('ovTitle');}
function updateBest(){document.getElementById('bestLine').textContent=best>0?'שיא: '+best:'';}
const portraits=[];
function buildCards(){
  const wrap=document.getElementById('cards');wrap.innerHTML='';
  CH_ORDER.forEach((id,i)=>{const C=CHARS[id],d=document.createElement('div');d.className='card';d.dataset.i=i;
    const lbl=['כוח','מהירות','חיים'];
    d.innerHTML=`<canvas width="320" height="160"></canvas><h3>${C.name}</h3><div class="ti">${C.title}</div>`+lbl.map((l,k)=>`<div class="stat"><b>${l}</b><span class="pips">${[0,1,2].map(j=>`<i class="${j<C.stats[k]?'f':''}"></i>`).join('')}</span></div>`).join('')+`<div class="spc">${C.special}</div><div class="dsc">${C.desc}</div>`;
    d.addEventListener('click',()=>startRun(id));d.addEventListener('pointerenter',()=>{selIdx=i;markSel();});
    wrap.appendChild(d);const cv=d.querySelector('canvas');portraits.push({id,cv,g:cv.getContext('2d')});});
  markSel();
}
function markSel(){document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('sel',i===selIdx));}
function drawPortraits(){
  portraits.forEach((pc,i)=>{const g=pc.g,cv=pc.cv;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);const k=cv.width/160;g.setTransform(k,0,0,k,0,0);
    const C=CHARS[pc.id],sel=i===selIdx,rg=g.createRadialGradient(80,52,4,80,52,70);rg.addColorStop(0,hexA(C.accent,sel?0.5:0.25));rg.addColorStop(1,hexA(C.accent,0));g.fillStyle=rg;g.fillRect(0,0,160,80);
    g.fillStyle='rgba(0,0,0,0.35)';g.beginPath();g.ellipse(80,76,26*C.size,4,0,0,TAU);g.fill();
    g.save();g.translate(80,77);g.scale(1.1,1.1);const cyc=(gTime*0.7+i*0.4)%2.2,st=sel&&cyc<0.38?'attack':'idle';
    drawArmadillo(g,C,0,0,1,{state:st,t:gTime+i,st:st==='attack'?cyc%0.38:0,combo:cyc<0.38?Math.min(3,1+Math.floor(cyc/0.13)):1,vx:0,vy:0,id:pc.id});g.restore();});
}
function openSelect(){mode='select';ensureLayers('warm');AudioSys.init();if(!Music.on)Music.start(0);showOv('ovSelect');AudioSys.sfx('select');}
document.getElementById('ctlHint').innerHTML=isTouch?'◀ ▶ תנועה · קפיצה · מכה (3 הקשות = קומבו) · גלגול שובר מגנים · ★ מכה מיוחדת כשמד הזוהר מלא':'<span dir="ltr"><kbd>←</kbd> <kbd>→</kbd></span> תנועה · <span dir="ltr"><kbd>↑</kbd>/<kbd>Space</kbd></span> קפיצה · <span dir="ltr"><kbd>J</kbd>/<kbd>Z</kbd></span> מכה · <span dir="ltr"><kbd>K</kbd>/<kbd>X</kbd></span> גלגול · <span dir="ltr"><kbd>L</kbd>/<kbd>C</kbd></span> מכה מיוחדת · <span dir="ltr"><kbd>P</kbd></span> הפסקה<br><kbd>↓</kbd> יחד עם קפיצה: ירידה מגגון · בחירת דמות: <span dir="ltr"><kbd>←</kbd> <kbd>→</kbd></span> ו-<kbd>Enter</kbd>, או <span dir="ltr"><kbd>1</kbd>–<kbd>3</kbd></span>';
const on=(id,fn)=>document.getElementById(id).addEventListener('click',e=>{e.preventDefault();AudioSys.init();fn();e.currentTarget.blur();});
on('bPlay',openSelect);
on('bResume',()=>setPaused(false));
on('bRestart',()=>{paused=false;try{AudioSys.ac&&AudioSys.ac.resume();}catch(e){}G.score=G.stageStartScore;loadStage(G.stageIdx);});
on('bQuit',toTitle);
on('bNext',()=>{loadStage(G.stageIdx+1);});
on('bCont',()=>{G.lives=3;G.score=G.stageStartScore;player=null;loadStage(G.stageIdx);});
on('bOverQuit',toTitle);
on('bAgain',()=>{player=null;openSelect();});
on('bEndTitle',toTitle);
document.getElementById('btnPause').addEventListener('click',e=>{e.currentTarget.blur();if(mode==='play')setPaused(!paused);});
const muteBtn=document.getElementById('btnMute');
function syncMute(){muteBtn.textContent=AudioSys.muted?'✕':'♪';muteBtn.style.opacity=AudioSys.muted?0.6:1;}
muteBtn.addEventListener('click',e=>{e.currentTarget.blur();AudioSys.init();AudioSys.setMuted(!AudioSys.muted);syncMute();});
syncMute();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused)setPaused(true);});

// ================= LAYOUT & LOOP =================
let layoutTimer=null;
function layout(){
  const vw=window.innerWidth,vh=window.innerHeight;const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const portrait=vh>vw*1.05;document.body.classList.toggle('portrait',portrait);
  const availH=portrait&&isTouch?Math.max(vh*0.42,vh-250):vh;const scale=Math.min(vw/W,availH/H);
  const cw=W*scale,ch=H*scale,left=(vw-cw)/2,top=portrait&&isTouch?Math.max(8,Math.min((availH-ch)/2,vh*0.1)):(vh-ch)/2;
  Object.assign(cvs.style,{width:cw+'px',height:ch+'px',left:left+'px',top:top+'px'});
  cvs.width=Math.round(cw*dpr);cvs.height=Math.round(ch*dpr);
  const tb=document.getElementById('topbtns');tb.style.top=(top+8)+'px';tb.style.right=(vw-left-cw+8)+'px';
  const tip=document.getElementById('tip');tip.style.top=(top+ch+10)+'px';
  requestAnimationFrame(cacheButtons);
  clearTimeout(layoutTimer);layoutTimer=setTimeout(()=>ensureLayers(layers?layers.key:'warm'),250);
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){
  let d=(now-last)/1000;last=now;if(d>0.1)d=0.1;if(d<0)d=0;acc+=d;refreshHeld();
  let n=0;while(acc>=STEP&&n<6){try{update(STEP);}catch(err){console.error(err);}acc-=STEP;n++;}if(n>=6)acc=0;
  try{render();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
layout();ensureLayers('warm');buildCards();updateBest();
if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load(`20px Bangers`),document.fonts.load(`20px "Secular One"`,'אבג'),document.fonts.load(`700 12px Rubik`,'אבג')]),new Promise(r=>setTimeout(r,2500))]).then(()=>{layers=null;ensureLayers(S?S.def.theme:'warm');}).catch(()=>{});}
requestAnimationFrame(frame);
// lightweight test hook
window.__rr={get state(){return{mode,paused,stage:S&&S.i,camX,lock:S&&S.lockX,px:player&&player.x,hp:player&&player.hp,lives:G&&G.lives,enemies:enemies.length,score:G&&G.score,boss:S&&S.boss&&S.boss.hp};},
  warp(x){if(player){player.x=x;camX=clamp(x-W*0.42,0,S.len-W);}},killAll(){for(const e of enemies)if(!e.dead){e.hp=1;hitEnemy(e,5,0,0,{breakGuard:true});}},fill(){if(player)player.glow=100;},god(){if(player){player.maxHp=9999;player.hp=9999;}}};
})();
</script>
