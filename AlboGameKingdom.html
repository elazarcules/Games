<style>
:root{
  --ink:#2e1065;
  --font:'Fredoka','Varela Round','Arial Rounded MT Bold',system-ui,sans-serif;
  --top:calc(70px + env(safe-area-inset-top));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);color:var(--ink);
  background:linear-gradient(135deg,#67e8f9,#a78bfa 35%,#f472b6 68%,#fde047);
  background-size:400% 400%;animation:bg 22s ease infinite;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none;padding:0}
.en{font-family:'Fredoka',system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}

/* ---------- background ---------- */
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bgfx span{position:absolute;bottom:-140px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}

/* ---------- coin ---------- */
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.14em;position:relative;font-style:normal;
  background:radial-gradient(circle at 35% 30%,#fffbea 0 8%,#fde047 24%,#facc15 50%,#eab308 72%,#a16207 100%);
  box-shadow:inset 0 0 0 .07em #ca8a04,0 .06em 0 #854d0e}
.coin::after{content:'★';position:absolute;inset:0;display:grid;place-items:center;font-size:.58em;color:#a16207;line-height:1}
.coin.fly{position:fixed;font-size:30px;z-index:80;pointer-events:none;margin:-15px 0 0 -15px}

/* ---------- topbar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));
  background:rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid rgba(255,255,255,.35)}
.tb-avatar{width:50px;height:50px;border-radius:50%;background:#fff;font-size:31px;box-shadow:0 4px 0 #c4b5fd;display:grid;place-items:center;flex:none}
.coin-pill{display:flex;align-items:center;gap:6px;background:linear-gradient(#fef08a,#facc15);border-radius:999px;padding:4px 8px 4px 14px;
  font-size:1.45rem;box-shadow:0 4px 0 #ca8a04;color:#713f12;min-width:96px;justify-content:center}
.coin-pill .coin{font-size:28px;flex:none}
.coin-pill.bump{animation:bump .35s}
.tb-spacer{flex:1}
.tb-box{width:54px;height:50px;border-radius:16px;background:#fff;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.05;box-shadow:0 4px 0 #c4b5fd;position:relative;flex:none}
.tb-box small{font-size:.72rem;font-weight:700;color:#7c3aed;display:flex;align-items:center;gap:2px}
.tb-box.ready{animation:wiggle 1.4s infinite;background:linear-gradient(#fef9c3,#fde047);box-shadow:0 4px 0 #ca8a04}
.tb-box.night.ready{background:linear-gradient(#e0e7ff,#a5b4fc);box-shadow:0 4px 0 #4338ca}
.tb-box.ready::after{content:'!';position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;font-size:.85rem;display:grid;place-items:center;font-weight:700}
.icon-btn{width:48px;height:48px;border-radius:50%;background:#fff;font-size:22px;box-shadow:0 4px 0 #c4b5fd;flex:none;display:grid;place-items:center;transition:transform .1s}
.icon-btn:active,.tb-box:active,.tb-avatar:active{transform:translateY(3px)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:calc(var(--top) + 10px) calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.screen.active{display:flex;animation:screenIn .4s ease}
.h2{margin:4px 0 6px;font-size:clamp(1.9rem,8vw,2.6rem);color:#fff;-webkit-text-stroke:2px #7c3aed;paint-order:stroke fill;text-shadow:0 5px 0 #7c3aed;text-align:center}

/* ---------- buttons ---------- */
.btn{--c:#22c55e;--d:#15803d;background:var(--c);color:#fff;font-size:1.45rem;font-weight:700;padding:.55em 1.3em;border-radius:999px;
  box-shadow:0 6px 0 var(--d),0 12px 20px rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s;white-space:nowrap}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.btn-xl{font-size:clamp(1.6rem,7vw,2.2rem);padding:.5em 1.5em}
.btn.blue{--c:#3b82f6;--d:#1d4ed8}.btn.orange{--c:#fb923c;--d:#c2410c}.btn.purple{--c:#a855f7;--d:#7e22ce}.btn.pink{--c:#ec4899;--d:#be185d}
.btn.ghost{--c:rgba(255,255,255,.28);--d:rgba(0,0,0,.18)}
.pulse{animation:pulse 1.3s ease-in-out infinite}

/* ---------- splash ---------- */
#scr-splash{justify-content:center;padding-top:calc(14px + env(safe-area-inset-top))}
.splash{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:relative;z-index:2}
.sub{font-size:1.4rem;color:#fff;font-weight:700;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.hero{font-size:92px;line-height:1.1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.12))}
.hello-back{font-size:1.4rem;color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.2);min-height:1.5em}

/* ---------- animated logo (opening screen) ---------- */
.lg-scene{width:min(92vw,56vh,520px);aspect-ratio:1/1;position:relative;display:grid;place-items:center;isolation:isolate;cursor:pointer;margin-top:-6px}
.lg-scene::before{content:'';position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9) 0 32%,rgba(255,255,255,0) 70%);z-index:-1}
.lg-logo{width:100%;overflow:visible;filter:drop-shadow(0 18px 22px #34174a35);animation:lg-arrive 1.2s cubic-bezier(.2,1.3,.3,1) both,lg-float 5s ease-in-out 1.2s infinite}
.lg-flag{transform-box:fill-box;transform-origin:left center;animation:lg-wave 2.1s ease-in-out infinite alternate}
.lg-flag.two{animation-delay:-.7s}.lg-flag.three{animation-delay:-1.3s}
.lg-crown{transform-box:fill-box;transform-origin:center bottom;animation:lg-crown 3.4s ease-in-out infinite}
.lg-shine{animation:lg-twinkle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lg-shine:nth-of-type(2n){animation-delay:-.9s}
.lg-pawn{animation:lg-bob 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lg-dice{animation:lg-bob 3.1s ease-in-out -1.2s infinite;transform-box:fill-box;transform-origin:center}
.lg-controller{animation:lg-bob 3.4s ease-in-out -.5s infinite;transform-box:fill-box;transform-origin:center}
.lg-heading{filter:drop-shadow(2px 6px 0 #a95505)}
.lg-spark{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);pointer-events:none;animation:lg-sparkle var(--d) ease-in-out var(--delay) infinite}
.lg-spark::before,.lg-spark::after{content:'';position:absolute;background:inherit;left:50%;top:50%;transform:translate(-50%,-50%)}
.lg-spark::before{width:2px;height:230%}.lg-spark::after{height:2px;width:230%}
@keyframes lg-arrive{from{opacity:0;transform:scale(.55) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes lg-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes lg-wave{0%{transform:skewY(-7deg) scaleX(.94)}100%{transform:skewY(6deg) scaleX(1.05)}}
@keyframes lg-crown{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes lg-twinkle{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.35)}}
@keyframes lg-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes lg-sparkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:.6;transform:scale(.7) rotate(80deg)}}
@media (prefers-reduced-motion:reduce){.lg-scene *,.lg-scene *::before,.lg-scene *::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ---------- characters ---------- */
.collect{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;font-weight:700;margin-bottom:12px;font-size:1.05rem}
.collect .bar{width:110px;height:12px;border-radius:99px;background:#e9d5ff;overflow:hidden}
.collect .bar i{display:block;height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);border-radius:99px;transition:width .6s}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px;width:100%;max-width:760px;padding-bottom:120px}
.ccard{background:#fff;border-radius:22px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 #c4b5fd;position:relative;transition:transform .15s}
.ccard:active{transform:scale(.95)}
.ce{font-size:52px;line-height:1.15}
.cn{font-size:1rem;font-weight:700;text-align:center;line-height:1.1;min-height:1.1em}
.ccard.sel{background:linear-gradient(#fef9c3,#fde047);box-shadow:0 6px 0 #ca8a04,0 0 0 4px #fff,0 0 26px #fde047;transform:scale(1.06)}
.ccard.sel::before{content:'✔';position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:#22c55e;color:#fff;display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 #15803d;z-index:2}
.ccard.sel .ce{animation:bob 1.6s ease-in-out infinite}
.ccard.locked{background:rgba(255,255,255,.5);box-shadow:0 6px 0 rgba(109,40,217,.25)}
.ccard.locked .ce{filter:brightness(0) opacity(.22)}
.ccard.r-legend:not(.locked){background:linear-gradient(#fff,#fef3c7);box-shadow:0 6px 0 #f59e0b}
.ccard.r-rare:not(.locked){background:linear-gradient(#fff,#dbeafe);box-shadow:0 6px 0 #60a5fa}
.ccard.sel.r-legend,.ccard.sel.r-rare{background:linear-gradient(#fef9c3,#fde047);box-shadow:0 6px 0 #ca8a04,0 0 0 4px #fff,0 0 26px #fde047}
.lockb{font-size:.78rem;font-weight:700;color:#6d28d9}
.rar{font-size:.7rem;color:#fff;background:var(--rc);border-radius:99px;padding:1px 8px;font-weight:700}
.newb{position:absolute;top:-9px;left:-6px;background:#ef4444;color:#fff;font-size:.82rem;font-weight:700;padding:3px 9px;border-radius:99px;
  transform:rotate(-8deg);box-shadow:0 3px 0 #991b1b;animation:wiggle 1.5s infinite;z-index:2}
.sticky-bottom{position:fixed;bottom:0;left:0;right:0;padding:14px 12px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;
  background:linear-gradient(transparent,rgba(124,58,237,.45));z-index:30;pointer-events:none}
.sticky-bottom .btn{pointer-events:auto}

/* ---------- menu ---------- */
.menu{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:20px}
.hello{display:flex;align-items:center;gap:12px;width:100%}
.avatar-xl{font-size:76px;line-height:1;width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;
  box-shadow:0 7px 0 #c4b5fd,0 0 0 5px rgba(255,255,255,.5)}
.avatar-xl span{display:block;animation:bob 2.4s ease-in-out infinite}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-size:clamp(1.15rem,4.8vw,1.45rem);font-weight:700;box-shadow:0 5px 0 rgba(109,40,217,.3);flex:1;animation:popIn .5s}
.bubble::before{content:'';position:absolute;right:-24px;top:50%;margin-top:-10px;border:10px solid transparent;border-left:14px solid #fff}
.gift{width:100%;font-size:1.5rem;font-weight:700;color:#fff;border-radius:22px;padding:12px;background:linear-gradient(90deg,#f43f5e,#f97316,#f43f5e);background-size:200% 100%;
  box-shadow:0 6px 0 #9f1239;animation:shine 2s linear infinite, pulse 1.4s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.boxcard{border-radius:24px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;position:relative;overflow:hidden;transition:transform .1s}
.boxcard:active{transform:translateY(4px)}
.boxcard.morning{background:linear-gradient(160deg,#fde047,#fb923c);box-shadow:0 7px 0 #c2410c}
.boxcard.night{background:linear-gradient(160deg,#818cf8,#3730a3);box-shadow:0 7px 0 #1e1b4b}
.boxcard .chest{--w:82px;margin-top:6px}
.bc-name{font-size:1.35rem;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.bc-price{background:#fff;color:var(--ink);border-radius:999px;padding:2px 12px;font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:5px}
.bc-bar{width:86%;height:10px;border-radius:99px;background:rgba(0,0,0,.2);overflow:hidden}
.bc-bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s}
.bc-note{font-size:.95rem;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.boxcard.ready{animation:glow 1.6s ease-in-out infinite}
.boxcard.ready .chest{animation:wiggle 1.2s infinite}
.sec{width:100%;margin-top:8px}
.sec-h{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);margin:0 4px 10px}
.sec-h .badge{min-width:44px;height:44px;padding:0 6px;border-radius:14px;background:#fff;color:var(--c2);display:grid;place-items:center;font-size:1.25rem;box-shadow:0 4px 0 var(--c3);text-shadow:none}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:14px}
.gcard{background:linear-gradient(160deg,var(--c1),var(--c2));border-radius:24px;padding:14px 8px 12px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 7px 0 var(--c3),0 12px 18px rgba(0,0,0,.15);position:relative;transition:transform .1s;animation:popIn .45s backwards}
.gcard:active{transform:translateY(5px) scale(.98);box-shadow:0 2px 0 var(--c3)}
.gc-icon{font-size:50px;line-height:1.1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.gc-name{font-size:1.2rem;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.2);line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center;text-align:center}
.gc-stars{font-size:1.15rem;letter-spacing:2px}
.gc-stars b{color:rgba(255,255,255,.4)}
.gc-stars b.on{color:#fde047;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.gcard.locked{background:linear-gradient(160deg,#cbd5e1,#94a3b8);box-shadow:0 7px 0 #64748b}
.gcard.locked .gc-icon{animation:wiggle 2.5s infinite}
.gc-hint{font-size:.88rem;background:rgba(255,255,255,.35);border-radius:99px;padding:2px 10px;font-weight:700}

/* ---------- game ---------- */
#scr-game{padding-top:calc(var(--top) + 6px)}
.g-head{display:flex;align-items:center;gap:10px;width:100%;max-width:640px}
.g-title{font-weight:700;color:#fff;font-size:1rem;text-shadow:0 2px 0 rgba(0,0,0,.2);max-width:30%;text-align:left;line-height:1.1}
.progress{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:nowrap;min-width:0}
.pd{width:26px;height:26px;flex:none;border-radius:50%;background:rgba(255,255,255,.45);display:grid;place-items:center;font-size:17px;box-shadow:inset 0 2px 0 rgba(0,0,0,.1)}
.pd.done{background:#fde047;box-shadow:0 3px 0 #ca8a04;animation:pop .4s}
.pd.done::after{content:'⭐';font-size:15px}
.pd.cur{background:#fff;animation:pulse 1s ease-in-out infinite}
.g-main{flex:1;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px}
.qrow{display:flex;align-items:center;gap:10px;width:100%}
.buddy{font-size:58px;line-height:1;flex:none;filter:drop-shadow(0 5px 0 rgba(0,0,0,.15));transition:transform .2s}
.buddy.jump{animation:jump .7s}
.buddy.shake{animation:headShake .5s}
.prompt-card{flex:1;background:#fff;border-radius:22px;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 0 rgba(109,40,217,.35);min-height:64px}
.prompt{flex:1;font-size:clamp(1.2rem,5.2vw,1.65rem);font-weight:700;line-height:1.25}
.hl{color:#db2777;font-size:1.15em}
.visual{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:110px;width:100%}
.visual.in{animation:popIn .45s}
.options{display:grid;gap:12px;width:100%;max-width:560px;padding-bottom:8px}
.options.letters,.options.nums,.options.colors,.options.balloons{grid-template-columns:repeat(4,1fr)}
.options.pics{grid-template-columns:repeat(3,1fr)}
.options.words{grid-template-columns:1fr;max-width:380px}
.options.groups{grid-template-columns:1fr 1fr}
.options.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.opt{background:#fff;border-radius:22px;box-shadow:0 6px 0 #c4b5fd,0 10px 18px rgba(76,29,149,.16);font-size:2.6rem;min-height:84px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,background .2s,opacity .3s;font-weight:700;position:relative;padding:6px;
  animation:popIn .4s backwards;color:var(--ink)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #c4b5fd}
.opt.right{background:linear-gradient(#4ade80,#16a34a);color:#fff;box-shadow:0 6px 0 #15803d;animation:boing .6s}
.opt.wrong{background:#fecaca;color:#b91c1c;box-shadow:0 6px 0 #fca5a5;animation:shake .45s;opacity:.5}
.opt.dim{opacity:.35;transform:scale(.94)}
.opt.shake{animation:shake .45s;background:#fecaca}
.opt.hint{animation:pulse .8s ease-in-out infinite;box-shadow:0 6px 0 #c4b5fd,0 0 0 4px #fde047,0 0 22px #fde047}
.options.letters .opt{font-size:clamp(2.4rem,11vw,3.2rem)}
.options.nums .opt{font-size:clamp(2.4rem,11vw,3.2rem);font-family:'Fredoka',system-ui,sans-serif}
.options.pics .opt{min-height:112px}
.pe{font-size:54px;line-height:1.05}
.pn{font-size:1.05rem;margin-top:4px;color:#6b21a8}
.opt.right .pn{color:#fff}
.opt .pn{animation:popIn .35s}
.options.words .opt{font-size:2.1rem;min-height:68px}
.options.groups .opt{min-height:150px;padding:12px 8px}
.gwrap{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(26px,7.5vw,34px);line-height:1.15}
.cnt{position:absolute;top:-12px;left:-8px;background:#7c3aed;color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.4rem;display:grid;place-items:center;box-shadow:0 3px 0 #4c1d95;animation:pop .4s}
.dot{width:clamp(48px,15vw,66px);height:clamp(48px,15vw,66px);border-radius:50%;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 3px #e5e7eb}
.options.balloons .opt,.options.balloons .opt.right,.options.balloons .opt.wrong{background:none;box-shadow:none;min-height:160px;justify-content:flex-start;padding-top:8px}
.balloon{width:clamp(62px,18vw,80px);height:clamp(76px,22vw,96px);border-radius:50% 50% 48% 48%/56% 56% 44% 44%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75) 0 8%,transparent 10%),var(--c);display:grid;place-items:center;color:#fff;
  font-size:clamp(1.8rem,8vw,2.4rem);font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25);position:relative;animation:float 2.6s ease-in-out infinite;
  animation-delay:var(--d);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12);font-family:'Fredoka',system-ui,sans-serif}
.balloon::before{content:'';position:absolute;bottom:-9px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:9px solid var(--c);transform:rotate(180deg)}
.balloon::after{content:'';position:absolute;top:100%;left:50%;width:2px;height:44px;background:rgba(255,255,255,.85);margin-top:8px}
.opt.right .balloon{animation:popBalloon .45s forwards}
.opt.wrong .balloon{animation:shake .45s}
.options.balloons .opt.right::after{content:'💥';position:absolute;top:10px;font-size:64px;animation:pop .5s}
.pic{font-size:clamp(86px,25vw,132px);line-height:1.05;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12));animation:bob 2.4s ease-in-out infinite;cursor:pointer}
.word{display:flex;gap:6px;direction:rtl}
.word span{font-size:clamp(2.2rem,10vw,2.8rem);font-weight:700;background:#fff;border-radius:14px;min-width:clamp(48px,14vw,60px);height:clamp(58px,16vw,70px);display:grid;place-items:center;box-shadow:0 5px 0 #c4b5fd}
.word .blank{background:#fef08a;outline:3px dashed #f59e0b;outline-offset:-3px;color:#f59e0b;animation:pulse 1.2s ease-in-out infinite}
.word .blank.filled{background:#bbf7d0;outline:3px solid #22c55e;color:#15803d;animation:pop .4s}
.bigletter{font-size:clamp(100px,30vw,150px);font-weight:700;color:#fff;-webkit-text-stroke:3px #7c3aed;paint-order:stroke fill;text-shadow:0 8px 0 #7c3aed;line-height:1.1;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
.hear{font-size:72px;background:#fff;border-radius:50%;width:140px;height:140px;box-shadow:0 8px 0 #c4b5fd;animation:pulse 1.6s ease-in-out infinite}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;direction:ltr}
.eq .grp{display:flex;flex-wrap:wrap;justify-content:center;max-width:min(42vw,200px);background:rgba(255,255,255,.8);border-radius:18px;padding:8px;gap:2px;font-size:clamp(24px,7vw,32px);line-height:1.15}
.eq .grp i{font-style:normal;position:relative}
.eq .grp i.gone s{text-decoration:none;opacity:.3;filter:grayscale(1)}
.eq .grp i.gone::after{content:'✖';color:#ef4444;position:absolute;inset:0;display:grid;place-items:center;font-size:.8em;font-weight:700}
.eq b{font-size:clamp(2.2rem,10vw,3rem);background:#fff;border-radius:16px;min-width:clamp(54px,15vw,66px);padding:0 10px;height:clamp(58px,16vw,70px);display:grid;place-items:center;
  box-shadow:0 5px 0 #93c5fd;color:#1d4ed8;font-family:'Fredoka',system-ui,sans-serif}
.eq b.qm{background:#fef08a;color:#d97706;box-shadow:0 5px 0 #f59e0b;animation:pulse 1.2s ease-in-out infinite}
.eq b.qm.filled{background:#bbf7d0;color:#15803d;box-shadow:0 5px 0 #22c55e;animation:pop .4s}
.eq .op{font-size:clamp(2rem,9vw,2.6rem);font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.countbox{display:grid;gap:6px;background:rgba(255,255,255,.8);border-radius:22px;padding:12px 14px}
.countbox i{font-size:clamp(34px,10vw,48px);font-style:normal;animation:popIn .4s backwards;position:relative;cursor:pointer;line-height:1.15;text-align:center}
.countbox i.counted{animation:pop .3s}
.countbox i.counted::after{content:attr(data-n);position:absolute;top:-4px;right:-6px;background:#7c3aed;color:#fff;font-size:14px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:'Fredoka',sans-serif}
.tiphint{font-size:.95rem;color:#fff;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.enword{font-size:clamp(2.6rem,12vw,4rem);font-weight:700;background:#fff;border-radius:24px;padding:6px 26px;box-shadow:0 7px 0 #86efac;color:#15803d;cursor:pointer}
.enword .spk{font-size:.5em;vertical-align:middle}
.cap{background:#fff;border-radius:999px;padding:6px 18px;font-size:1.35rem;font-weight:700;box-shadow:0 4px 0 #c4b5fd;animation:popIn .4s}
.blob{width:clamp(120px,36vw,160px);height:clamp(120px,36vw,160px);background:var(--c);border-radius:42% 58% 63% 37%/41% 44% 56% 59%;
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.12),0 0 0 6px #fff,0 10px 0 6px rgba(0,0,0,.08);animation:morph 6s ease-in-out infinite,bob 2.4s ease-in-out infinite}
.seq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.car{min-width:clamp(54px,15vw,66px);height:clamp(54px,15vw,66px);padding:0 6px;background:#fff;border-radius:14px;font-size:clamp(1.9rem,8.5vw,2.4rem);font-weight:700;display:grid;place-items:center;
  box-shadow:0 5px 0 #c4b5fd;position:relative;margin-bottom:14px}
.car::after{content:'';position:absolute;bottom:-17px;left:6px;right:6px;height:14px;
  background:radial-gradient(circle,#334155 6px,transparent 7px) left/14px 14px no-repeat,radial-gradient(circle,#334155 6px,transparent 7px) right/14px 14px no-repeat}
.car.q{background:#fef08a;color:#d97706;animation:pulse 1.2s ease-in-out infinite}
.car.q.filled{background:#bbf7d0;color:#15803d;animation:pop .4s}
.slots{display:flex;gap:8px;direction:rtl}
.slot{width:clamp(56px,16vw,68px);height:clamp(64px,18vw,76px);border:4px dashed #a78bfa;border-radius:16px;background:rgba(255,255,255,.6);font-size:clamp(2.2rem,10vw,2.8rem);font-weight:700;display:grid;place-items:center}
.slot.next{border-color:#f59e0b;background:#fef9c3;animation:pulse 1s ease-in-out infinite}
.slot.filled{border-style:solid;border-color:#22c55e;background:#fff;animation:pop .3s}
.slots.done .slot{background:#bbf7d0;animation:boing .6s}
.opt.tile{width:clamp(64px,19vw,80px);height:clamp(64px,19vw,80px);min-height:0;font-size:clamp(2.2rem,10vw,2.8rem)}
.opt.tile.used{transform:scale(0);opacity:0;pointer-events:none}
.options.mem{margin:auto 0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:470px;margin:0 auto}
.mcard{aspect-ratio:3/4;perspective:700px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flipped .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mcard .f{background:linear-gradient(135deg,#a78bfa,#ec4899);box-shadow:0 5px 0 #6d28d9;font-size:2rem;color:#fff}
.mcard .f::before{content:'';position:absolute;inset:6px;border:3px dashed rgba(255,255,255,.5);border-radius:12px}
.mcard .b{background:#fff;transform:rotateY(180deg);box-shadow:0 5px 0 #c4b5fd;padding:4px}
.mcard.matched .b{background:#dcfce7;box-shadow:0 5px 0 #22c55e}
.mcard.matched{animation:boing .6s}
.me{font-size:clamp(34px,10vw,46px)}
.mw{font-size:clamp(1rem,4.6vw,1.4rem);font-weight:700;color:#15803d}
.ml{font-size:clamp(2rem,9vw,2.6rem);font-weight:700;color:#7c3aed}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;overflow-y:auto;align-items:center;justify-content:center;padding:20px;background:rgba(46,16,101,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#endOv{z-index:35;padding-top:calc(var(--top) + 10px)}
.card{background:#fff;border-radius:32px;padding:20px 20px 24px;width:min(92vw,420px);text-align:center;box-shadow:0 10px 0 rgba(109,40,217,.4),0 20px 40px rgba(0,0,0,.3);
  animation:popIn .5s cubic-bezier(.2,1.6,.4,1);display:flex;flex-direction:column;align-items:center;gap:8px}
.end-buddy{font-size:80px;line-height:1;animation:jump 1s ease-in-out infinite}
.card h2{margin:0;font-size:2.2rem;color:#7c3aed}
.end-stars{display:flex;gap:6px;direction:ltr}
.st{font-size:64px;color:#e5e7eb;display:inline-block;animation:starIn .6s backwards;line-height:1}
.st.on{color:#facc15;text-shadow:0 4px 0 #ca8a04}
.end-coins{font-size:2rem;font-weight:700;color:#a16207;display:flex;align-items:center;gap:8px}
.end-bonus{font-size:1.2rem;font-weight:700;color:#fff;background:linear-gradient(90deg,#f43f5e,#a855f7);border-radius:99px;padding:4px 16px;animation:pop .5s .9s backwards}
.end-hint{font-size:1.15rem;font-weight:700;background:#fef9c3;border:3px dashed #f59e0b;border-radius:18px;padding:8px 14px;animation:pulse 1.2s ease-in-out infinite}
.end-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.end-btns .btn{font-size:1.3rem}

#boxOv{overflow:hidden;flex-direction:column;z-index:55}
#boxOv.morning{background:radial-gradient(circle at 50% 45%,#fff7ad,#fbbf24 45%,#ea580c)}
#boxOv.night{background:radial-gradient(circle at 50% 45%,#6366f1,#312e81 50%,#0f0a2e)}
#boxOv.night::before{content:'';position:absolute;inset:0;animation:twinkle 3s ease-in-out infinite;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 78% 12%,#fff,transparent),radial-gradient(3px 3px at 30% 80%,#fff,transparent),
  radial-gradient(2px 2px at 88% 70%,#fff,transparent),radial-gradient(2px 2px at 55% 30%,#fff,transparent),radial-gradient(3px 3px at 8% 60%,#fff,transparent),radial-gradient(2px 2px at 65% 88%,#fff,transparent)}
.rays{position:absolute;width:220vmax;height:220vmax;left:50%;top:50%;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 9deg,transparent 9deg 18deg);animation:spin 14s linear infinite;opacity:0;transition:opacity .6s;
  -webkit-mask:radial-gradient(circle,#000 0 12%,transparent 45%);mask:radial-gradient(circle,#000 0 12%,transparent 45%)}
.rays.show{opacity:1}
.box-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.box-title{font-size:clamp(2rem,9vw,2.6rem);font-weight:700;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)}
#chestWrap{transform:scale(var(--s,1));transition:transform .25s cubic-bezier(.2,1.6,.4,1);cursor:pointer}
#chestWrap .chest{--w:min(58vw,240px)}
.box-hint{font-size:1.5rem;color:#fff;font-weight:700;animation:pulse 1s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.taps{display:flex;gap:12px}
.taps i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35)}
.taps i.on{background:#fff;box-shadow:0 0 14px #fff}
.reveal{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.rv-label{font-size:clamp(1.8rem,8vw,2.3rem);font-weight:700;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);animation:popIn .5s}
.rv-emoji{font-size:clamp(110px,34vw,170px);line-height:1.1;animation:revealIn .9s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 30px #fff)}
.rv-emoji .coin{font-size:.8em}
.rv-name{font-size:clamp(1.8rem,8vw,2.4rem);font-weight:700;background:#fff;border-radius:999px;padding:4px 26px;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.2);animation:popIn .5s .4s backwards}
.rv-rar{font-size:1.2rem;font-weight:700;background:var(--rc);color:#fff;border-radius:999px;padding:3px 18px;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .5s .6s backwards}
.rv-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;animation:popIn .5s .8s backwards}

/* ---------- chest ---------- */
.chest{--w:110px;position:relative;width:var(--w);height:calc(var(--w) * .86);margin:0 auto}
.chest .body{position:absolute;left:0;right:0;bottom:0;height:60%;border-radius:12px 12px 20px 20px;background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 7px 0 var(--b3),0 14px 22px rgba(0,0,0,.25)}
.chest .lid{position:absolute;left:-5%;right:-5%;top:6%;height:38%;border-radius:999px 999px 10px 10px/120% 120% 10px 10px;background:linear-gradient(180deg,var(--l1),var(--l2));
  box-shadow:0 5px 0 var(--b3);transform-origin:50% 100%;transition:transform .55s cubic-bezier(.3,1.6,.5,1);z-index:2}
.chest .band{position:absolute;left:50%;top:0;bottom:0;width:16%;transform:translateX(-50%);background:var(--band)}
.chest .lid-band{position:absolute;left:50%;top:0;bottom:0;width:15%;transform:translateX(-50%);background:var(--band);border-radius:4px}
.chest .emblem{position:absolute;left:50%;top:0;transform:translate(-50%,-30%);font-size:calc(var(--w) * .24);background:#fff;border-radius:50%;width:calc(var(--w) * .36);height:calc(var(--w) * .36);
  display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:3;transition:opacity .3s,transform .3s}
.chest .glow{position:absolute;left:12%;right:12%;top:26%;height:46%;border-radius:50%;background:radial-gradient(#fff,rgba(255,255,255,0) 70%);opacity:0;transition:opacity .3s,transform .6s;z-index:1}
.chest.morning{--b1:#fbbf24;--b2:#f97316;--b3:#c2410c;--l1:#fde68a;--l2:#fbbf24;--band:#fff7ed}
.chest.night{--b1:#6366f1;--b2:#4338ca;--b3:#312e81;--l1:#a5b4fc;--l2:#6366f1;--band:#e0e7ff}
.chest.open .lid{transform:translateY(-80%) rotate(-28deg)}
.chest.open .emblem{opacity:0;transform:translate(-50%,-30%) scale(0)}
.chest.open .glow{opacity:1;transform:scale(2.6) translateY(-22%)}
.chest.shake{animation:chestShake .45s}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.cf{position:absolute;width:10px;height:14px;border-radius:3px}
.cf.e{width:auto;height:auto;font-size:26px;background:none}
#praise{position:fixed;left:50%;top:44%;z-index:60;pointer-events:none;white-space:nowrap;font-weight:700;font-size:clamp(2.4rem,10vw,4rem);color:#fff;
  -webkit-text-stroke:3px #7c3aed;paint-order:stroke fill;text-shadow:0 6px 0 #7c3aed,0 12px 22px rgba(0,0,0,.3);opacity:0;transform:translate(-50%,-50%)}
#praise.oops{-webkit-text-stroke-color:#ea580c;text-shadow:0 5px 0 #ea580c,0 12px 22px rgba(0,0,0,.25);font-size:clamp(1.8rem,8vw,2.8rem)}
#praise.go{animation:praise 1.15s ease forwards}
#toast{position:fixed;left:50%;top:calc(var(--top) + 10px);transform:translate(-50%,-220%);background:#fff;color:var(--ink);padding:12px 20px;border-radius:24px;font-size:1.2rem;font-weight:700;
  box-shadow:0 6px 0 rgba(109,40,217,.35),0 10px 24px rgba(0,0,0,.2);z-index:90;transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .3s;max-width:92vw;text-align:center;opacity:0;visibility:hidden}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ---------- keyframes ---------- */
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes rise{to{transform:translateY(-135vh)}}
@keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.22,.85)}55%{transform:scale(.9,1.12)}75%{transform:scale(1.06,.96)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-9deg)}20%{transform:rotate(9deg)}30%{transform:rotate(-6deg)}40%{transform:rotate(0)}}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(4px) scale(1.1,.9)}50%{transform:translateY(-26px) scale(.95,1.08) rotate(-8deg)}75%{transform:translateY(0) scale(1.06,.95)}}
@keyframes headShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes chestShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) translateY(-6px)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg) translateY(-4px)}80%{transform:rotate(5deg)}}
@keyframes revealIn{0%{transform:scale(0) rotate(-200deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes starIn{0%{transform:scale(0) rotate(-120deg);opacity:0}70%{transform:scale(1.35) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15) drop-shadow(0 0 14px #fff)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2) rotate(4deg);opacity:1}
  45%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37%/41% 44% 56% 59%}50%{border-radius:60% 40% 38% 62%/55% 60% 40% 45%}}
@keyframes popBalloon{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(0);opacity:0}}

@media (max-width:360px){
  .options.letters,.options.nums,.options.colors{grid-template-columns:repeat(2,1fr)}
  .tb-box{width:44px}
  .topbar{gap:6px}
  .tb-avatar{width:44px;height:44px;font-size:27px}
  .icon-btn{width:42px;height:42px;font-size:19px}

}

@media (min-height:760px){
  .pic{font-size:clamp(96px,26vw,150px)}

  .pe{font-size:64px}

  .options.groups .opt{min-height:190px}
  .bigletter{font-size:clamp(120px,36vw,180px)}
  .g-main{gap:16px}
}

/* =========================================================
   saved state (localStorage)
   ========================================================= */
const KEY = 'mamlechet-hamischakim-v1';
const DEF = () => ({ coins: 0, chars: CHARS.filter(c => c.r === 'start').map(c => c.id), games: CORE_GAMES.slice(), sel: null,
  stars: {}, gift: '', muted: false, boxes: 0, plays: 0, newChars: [], newGames: [] });
function load() {
  const d = DEF();
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && typeof s === 'object') {
      Object.assign(d, s);
      d.chars = [...new Set([...DEF().chars, ...(s.chars || [])])].filter(id => CHARS.some(c => c.id === id));
      d.games = [...new Set([...CORE_GAMES, ...(s.games || [])])].filter(id => GAMES.some(g => g.id === id));
      d.coins = Math.max(0, Number(d.coins) || 0);
    }
  } catch (e) { /* storage unavailable – play without saving */ }
  return d;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
let S = load();

/* =========================================================
   sound effects (Web Audio) + speech
   ========================================================= */
const sfx = {
  ctx: null,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { }
  },
  tone(f, start, dur, type = 'sine', vol = .2, slide) {
    const c = this.ctx; if (!c || S.muted) return;
    try {
      const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
    } catch (e) { }
  },
  correct() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .08, .28, 'triangle', .2)); },
  wrong() { this.tone(330, 0, .18, 'sine', .22, 220); this.tone(250, .16, .28, 'sine', .2, 160); },
  coin() { this.tone(988, 0, .07, 'square', .05); this.tone(1319, .06, .22, 'square', .05); },
  click() { this.tone(700, 0, .07, 'triangle', .14); },
  pop() { this.tone(880, 0, .12, 'sine', .25, 1400); },
  flip() { this.tone(500, 0, .08, 'triangle', .12, 800); },
  nope() { this.tone(200, 0, .2, 'square', .06, 150); },
  shake(i) { this.tone(180 + i * 90, 0, .18, 'triangle', .3, 120 + i * 70); this.sparkle(.05, 3); },
  sparkle(d = 0, n = 8) { for (let i = 0; i < n; i++) this.tone(1500 + Math.random() * 1600, d + i * .05, .12, 'sine', .07); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * .1, .32, 'triangle', .2)); this.sparkle(.7, 10); },
  win() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .12, .35, 'triangle', .2)); this.tone(1047, .6, .6, 'triangle', .18); this.sparkle(.6); }
};
const TTS = {
  ok: 'speechSynthesis' in window, voices: [],
  init() { if (!this.ok) return; const load = () => { try { this.voices = speechSynthesis.getVoices() || []; } catch (e) { } }; load(); try { speechSynthesis.onvoiceschanged = load; } catch (e) { } },
  voice(lang) {
    const re = lang === 'en' ? /^en/ : /^(he|iw)/;
    const list = this.voices.filter(v => re.test((v.lang || '').toLowerCase()));
    return list.find(v => /en-us/i.test(v.lang)) || list[0];
  }
};
function speak(parts) {
  if (!TTS.ok || S.muted || !parts) return;
  try {
    speechSynthesis.cancel();
    parts.forEach(([text, lang = 'he']) => {
      const v = TTS.voice(lang);
      if (TTS.voices.length && !v) return; // no voice for this language on the device
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = lang === 'en' ? 'en-US' : 'he-IL'; if (v) u.voice = v;
      u.rate = lang === 'en' ? .85 : .95; u.pitch = 1.1;
      speechSynthesis.speak(u);
    });
  } catch (e) { }
}
function isSpeaking() { try { return TTS.ok && !S.muted && (speechSynthesis.speaking || speechSynthesis.pending); } catch (e) { return false; } }

/* =========================================================
   visual effects
   ========================================================= */
function centerOf(e) { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function burst(x, y, n = 28, emojis) {
  const fx = $('#fx');
  for (let k = 0; k < n; k++) {
    const p = el('div', 'cf');
    if (emojis && k % 3 === 0) { p.classList.add('e'); p.textContent = pick(emojis); } else p.style.background = pick(CONFETTI);
    p.style.left = x + 'px'; p.style.top = y + 'px'; fx.appendChild(p);
    const ang = Math.random() * Math.PI * 2, v = 90 + Math.random() * 200, dx = Math.cos(ang) * v, dy = Math.sin(ang) * v - 120;
    const a = p.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${rnd(360)}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx * 1.3}px,${dy + 380}px) rotate(${rnd(720)}deg)`, opacity: 0 }
    ], { duration: 1100 + rnd(700), easing: 'cubic-bezier(.2,.7,.4,1)' });
    a.onfinish = () => p.remove();
  }
}
function rain(n = 70, emojis) {
  const fx = $('#fx'), W = innerWidth, H = innerHeight;
  for (let k = 0; k < n; k++) {
    const p = el('div', 'cf');
    if (emojis && k % 4 === 0) { p.classList.add('e'); p.textContent = pick(emojis); } else p.style.background = pick(CONFETTI);
    p.style.left = Math.random() * W + 'px'; p.style.top = '-30px'; fx.appendChild(p);
    const a = p.animate([
      { transform: 'translate(0,0) rotate(0)' },
      { transform: `translate(${(Math.random() - .5) * 160}px,${H + 60}px) rotate(${rnd(900)}deg)` }
    ], { duration: 1800 + rnd(1600), delay: rnd(700), easing: 'cubic-bezier(.3,.2,.6,1)', fill: 'backwards' });
    a.onfinish = () => p.remove();
  }
}
let shownCoins = S.coins;
function setShown(v, bump = true) {
  shownCoins = v; $('#coinNum').textContent = v;
  if (bump) restartAnim($('#coinPill'), 'bump');
}
function addCoins(n, fromEl) {
  S.coins += n; save(); updateCoinsUI(false);
  if (!fromEl || !document.body.contains(fromEl)) { setShown(S.coins); return; }
  const fx = $('#fx'), from = centerOf(fromEl), to = centerOf($('#coinIcon'));
  const count = Math.min(6, Math.max(3, Math.round(n / 5)));
  let landed = 0;
  for (let k = 0; k < count; k++) {
    const c = el('i', 'coin fly');
    const sx = from.x + (Math.random() - .5) * 50, sy = from.y + (Math.random() - .5) * 30;
    c.style.left = sx + 'px'; c.style.top = sy + 'px'; fx.appendChild(c);
    const dx = to.x - sx, dy = to.y - sy;
    const a = c.animate([
      { transform: 'translate(0,0) scale(.5)', opacity: 0 },
      { transform: `translate(${dx * .1}px,-70px) scale(1.4)`, opacity: 1, offset: .3 },
      { transform: `translate(${dx}px,${dy}px) scale(.8)`, opacity: 1 }
    ], { duration: 800, delay: k * 90, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'backwards' });
    a.onfinish = () => {
      c.remove(); sfx.coin(); landed++;
      const val = landed === count ? S.coins : Math.min(S.coins, shownCoins + Math.round(n / count));
      setShown(val);
    };
  }
}

/* =========================================================
   boxes
   ========================================================= */
function rollReward(type) {
  const B = BOXES[type];
  const lockedGames = GAMES.filter(g => g.box === type && !S.games.includes(g.id));
  const lockedTier = t => CHARS.filter(c => c.r === t && !S.chars.includes(c.id));
  const pity = (S.sinceGame || 0) >= 4; // a new game at least every 5 boxes
  if (lockedGames.length && (pity || Math.random() < B.gameChance)) return { kind: 'game', item: pick(lockedGames) };
  const tiers = Object.entries(B.tiers).filter(([t]) => lockedTier(t).length);
  if (tiers.length) {
    let r = Math.random() * tiers.reduce((s, [, w]) => s + w, 0);
    for (const [t, w] of tiers) { r -= w; if (r < 0) return { kind: 'char', item: pick(lockedTier(t)) }; }
    return { kind: 'char', item: pick(lockedTier(tiers[0][0])) };
  }
  if (lockedGames.length) return { kind: 'game', item: pick(lockedGames) };
  const any = [...CHARS.filter(c => !S.chars.includes(c.id)).map(item => ({ kind: 'char', item })),
               ...GAMES.filter(g => !S.games.includes(g.id)).map(item => ({ kind: 'game', item }))];
  if (any.length) return pick(any);
  return { kind: 'coins', amount: Math.round(B.price / 2) };
}
let BX = null;
function tryBox(type, src) {
  sfx.init();
  if (BX) return;
  const B = BOXES[type];
  if (S.coins < B.price) {
    const need = B.price - S.coins;

    speak([[`צריך עוד ${need} מטבעות`]]); sfx.nope(); shakeEl(src);
    return;
  }
  S.coins -= B.price;
  const rw = rollReward(type);
  if (rw.kind === 'char') { S.chars.push(rw.item.id); S.newChars = [...(S.newChars || []), rw.item.id]; }
  else if (rw.kind === 'game') { S.games.push(rw.item.id); S.newGames = [...(S.newGames || []), rw.item.id]; }
  else S.coins += rw.amount;
  S.sinceGame = rw.kind === 'game' ? 0 : (S.sinceGame || 0) + 1;
  S.boxes = (S.boxes || 0) + 1; save();
  setShown(S.coins); updateCoinsUI();

  BX = { type, rw, taps: 0, done: false };
  const ov = $('#boxOv'); ov.className = 'overlay ' + type;

/* =========================================================
   game engine
   ========================================================= */
let G = null;
function afterSpeech(fn, min = 1300, max = 4200) {
  const g = G, t0 = Date.now();
  const tick = () => {
    if (!G || G !== g) return;
    const dt = Date.now() - t0;
    if (dt >= max || (dt >= min && !isSpeaking())) fn(); else setTimeout(tick, 150);
  };
  setTimeout(tick, min);
}
function startGame(id) {
  const game = GAMES.find(g => g.id === id);
  if (!game || !S.games.includes(id)) return;
  S.newGames = (S.newGames || []).filter(x => x !== id); save();
  show('game');
  G = { game, idx: 0, total: game.total || 5, mistakes: 0, earned: 0, used: new Set(), busy: false, q: null };
  $('#gTitle').textContent = game.name;
  $('#gBuddy').textContent = curChar().e;
  renderProgress();
  if (game.type === 'memory') renderMemory(); else nextQuestion();
}
function renderProgress() {
  const p = $('#progress'); p.innerHTML = '';
  for (let k = 0; k < G.total; k++) p.appendChild(el('span', 'pd' + (k < G.idx ? ' done' : '') + (k === G.idx ? ' cur' : '')));
}
function genUnique() {
  let q;
  for (let t = 0; t < 40; t++) { q = G.game.gen(G.idx); if (!G.used.has(q.key)) break; }
  G.used.add(q.key); return q;
}
function nextQuestion() {
  if (!G) return;
  if (G.idx >= G.total) return endGame();
  G.busy = false; G.qMiss = 0;
  const q = G.q = genUnique();
  const vis = $('#visual'), box = $('#options');
  vis.className = 'visual'; box.className = 'options'; void vis.offsetWidth; vis.classList.add('in');
  if (G.game.type === 'build') return renderBuild(q);
  $('#prompt').innerHTML = q.prompt;
  vis.innerHTML = q.visual || '';
  q.style.split(' ').forEach(c => box.classList.add(c));
  box.innerHTML = '';
  q.options.forEach((o, j) => {
    const b = el('button', 'opt', String(o.html)); b.style.animationDelay = (j * .07) + 's';
    b.addEventListener('click', () => choose(b, o));
    box.appendChild(b);
  });
  if (q.setup) q.setup(vis, box);
  speak(q.say);
}
function choose(btn, o) {
  if (!G || G.busy || btn.disabled) return;
  if (o.correct) {
    G.busy = true; btn.classList.add('right');
    [...btn.parentNode.children].forEach(b => { if (b !== btn) b.classList.add('dim'); });
    if (G.q.after) G.q.after(btn);
    success(btn, G.q.sayAfter);
  } else {
    btn.disabled = true; btn.classList.add('wrong');
    if (o.word) btn.insertAdjacentHTML('beforeend', `<span class="pn">${o.word}</span>`);
    mistake(btn, o.word ? [[o.word]] : null);
  }
}
function success(fromEl, sayAfter) {
  G.idx++; G.earned += 10;
  sfx.correct();
  const p = centerOf(fromEl); burst(p.x, p.y, 26, ['⭐', '✨']);
  const pr = pick(PRAISE);
  showPraise(pr + ' ' + pick(PRAISE_EMO));
  restartAnim($('#gBuddy'), 'jump');
  addCoins(10, fromEl);
  renderProgress();
  speak([...(sayAfter || []), [pr]]);
  if (G.game.type === 'memory') { if (G.idx >= G.total) afterSpeech(endGame, 1200, 3500); }
  else afterSpeech(nextQuestion, 1400, 4200);
}
function mistake(btn, extra) {
  G.mistakes++; G.qMiss++;
  sfx.wrong(); restartAnim($('#gBuddy'), 'shake');
  const o = pick(OOPS); showPraise(o + ' 💪', true); speak([...(extra || []), [o]]);
}

/* ---------- build-a-word ---------- */
function renderBuild(q) {
  const L = [...q.word];
  q.say = [[`בואו נבנה את המילה ${q.word}!`]];
  $('#prompt').innerHTML = 'בונים את המילה! 👇 לפי הסדר';
  const vis = $('#visual');
  vis.innerHTML = `<div class="pic" data-say="${q.word}">${q.e}</div><div class="slots">${L.map(() => '<span class="slot"></span>').join('')}</div>`;
  const box = $('#options'); box.className = 'options tiles'; box.innerHTML = '';
  let order = shuffle(L);
  for (let t = 0; t < 12 && order.join('') === L.join(''); t++) order = shuffle(L);
  G.pos = 0;
  const slots = $$('.slot', vis); slots[0].classList.add('next');
  order.forEach((ch, j) => {
    const b = el('button', 'opt tile', ch); b.style.animationDelay = (j * .07) + 's';
    b.addEventListener('click', () => {
      if (!G || G.busy || b.disabled) return;
      const need = L[G.pos];
      if (ch === need) {
        b.disabled = true; b.classList.add('used'); $$('.tile.hint', box).forEach(x => x.classList.remove('hint'));
        const s = slots[G.pos]; s.textContent = ch; s.classList.remove('next'); s.classList.add('filled');
        sfx.pop(); G.pos++; G.qMiss = 0;
        if (G.pos < L.length) slots[G.pos].classList.add('next');
        else { G.busy = true; $('.slots', vis).classList.add('done'); success($('.slots', vis), [[q.word + '!']]); }
      } else {
        restartAnim(b, 'shake'); setTimeout(() => b.classList.remove('shake'), 460);
        mistake(b);
        if (G.qMiss >= 2) { const h = $$('.tile', box).find(x => !x.disabled && x.textContent === need); if (h) h.classList.add('hint'); }
      }
    });
    box.appendChild(b);
  });
  speak(q.say);
}

/* ---------- memory ---------- */
function renderMemory() {
  const mode = pick(['words', 'abc', 'he']); const pairs = []; let prompt;
  if (mode === 'words') {
    sample(EN_WORDS.filter(w => w.w.length <= 6), 6).forEach((w, k) => pairs.push(
      { p: k, html: `<span class="me">${w.e}</span>`, say: [[w.w, 'en']] }, { p: k, html: `<span class="mw en">${w.w}</span>`, say: [[w.w, 'en']] }));
    prompt = 'זוגות: תמונה ומילה באנגלית!';
  } else if (mode === 'abc') {
    sample(ABC, 6).forEach((L, k) => pairs.push(
      { p: k, html: `<span class="ml en">${L}</span>`, say: [[L, 'en']] }, { p: k, html: `<span class="ml en">${L.toLowerCase()}</span>`, say: [[L, 'en']] }));
    prompt = 'זוגות: אות גדולה ואות קטנה!';
  } else {
    sample(Object.keys(BY_FIRST), 6).forEach((L, k) => { const w = pick(BY_FIRST[L]); pairs.push(
      { p: k, html: `<span class="ml">${L}</span>`, say: [[LETTER_NAMES[L]]] }, { p: k, html: `<span class="me">${w.e}</span>`, say: [[w.w]] }); });
    prompt = 'זוגות: אות ותמונה שמתחילה בה!';
  }
  G.q = { say: [['מוצאים זוגות! ' + prompt.replace('זוגות: ', '')]] };
  $('#prompt').innerHTML = '🧠 ' + prompt;
  $('#visual').innerHTML = ''; $('#visual').className = 'visual hidden';
  const box = $('#options'); box.className = 'options mem'; box.innerHTML = '';
  const grid = el('div', 'mgrid'); box.appendChild(grid);
  const M = { first: null, lock: false };
  shuffle(pairs).forEach((c, j) => {
    const b = el('button', 'mcard', `<div class="in"><div class="f">⭐</div><div class="b">${c.html}</div></div>`);
    b.dataset.pair = c.p; b.style.animation = `popIn .4s ${j * .04}s backwards`;
    b.addEventListener('click', () => {
      if (!G || M.lock || b.classList.contains('flipped')) return;
      b.classList.add('flipped'); sfx.flip(); speak(c.say);
      if (!M.first) { M.first = b; return; }
      const a = M.first; M.first = null;
      if (a.dataset.pair === b.dataset.pair) {
        M.lock = true; const g = G;
        setTimeout(() => { a.classList.add('matched'); b.classList.add('matched'); M.lock = false; if (G && G === g) success(b); }, 450);
      } else {
        M.lock = true; G.mistakes++;
        setTimeout(() => { a.classList.remove('flipped'); b.classList.remove('flipped'); M.lock = false; }, 1050);
      }
    });
    grid.appendChild(b);
  });
  speak(G.q.say);
}

/* ---------- end of round ---------- */
function endGame() {
  if (!G) return;
  const g = G.game, m = G.mistakes, mem = g.type === 'memory';
  const stars = mem ? (m <= 4 ? 3 : m <= 8 ? 2 : 1) : (m === 0 ? 3 : m <= 2 ? 2 : 1);
  const bonus = stars === 3 ? 20 : 0;
  S.stars[g.id] = Math.max(S.stars[g.id] || 0, stars); S.plays = (S.plays || 0) + 1; save();
  const title = stars === 3 ? 'מושלם! 🏆' : stars === 2 ? 'כל הכבוד! 🎉' : 'סיימת! 👏';
  $('#endBuddy').textContent = curChar().e;
  $('#endTitle').textContent = title;
  $('#endStars').innerHTML = [1, 2, 3].map(k => `<span class="st ${k <= stars ? 'on' : ''}" style="animation-delay:${.2 + k * .25}s">★</span>`).join('');
  $('#endCoins').innerHTML = `<bdi dir="ltr">+${G.earned}</bdi> ${COIN}`;
  $('#endBonus').classList.toggle('hidden', !bonus);
  const willHave = S.coins + bonus;
  $('#endHint').classList.toggle('hidden', willHave < BOXES.morning.price);
  $('#endHint').textContent = willHave >= BOXES.night.price ? '🌙 יש מספיק לתיבת לילה! לפתוח?' : '☀️ יש מספיק לתיבת בוקר! לפתוח?';
  $('#endOv').classList.remove('hidden');
  sfx.win(); rain(80, ['⭐', '🎉', '✨']);
  speak([[title.replace(/[^֐-׿ !]/g, '').trim() + ` הרווחת ${G.earned + bonus} מטבעות!`]]);
  if (bonus) setTimeout(() => addCoins(bonus, $('#endBonus')), 1100);
  G.done = true;
}

function openGift() {
  if (S.gift === todayStr()) return;
  sfx.init(); S.gift = todayStr(); save();
  const b = $('#giftBtn'); sfx.fanfare(); const p = centerOf(b); burst(p.x, p.y, 40, ['🎁', '⭐', '✨']);
  addCoins(30, b); toast(`🎁 מתנה יומית: 30 ${COIN}! נתראה מחר!`); speak([['מתנה יומית! שלושים מטבעות!']]);
  setTimeout(() => { b.classList.add('hidden'); renderMenu(); }, 1200);
}

/* =========================================================
   wiring
   ========================================================= */
function initBg() {
  const bg = $('#bgfx');
  for (let i = 0; i < 14; i++) {
    const s = el('span'); const size = 30 + rnd(110);
    s.style.width = s.style.height = size + 'px'; s.style.left = rnd(100) + '%';
    s.style.animationDuration = (14 + rnd(16)) + 's'; s.style.animationDelay = -rnd(25) + 's';
    bg.appendChild(s);
  }
}
document.addEventListener('pointerdown', () => sfx.init(), { passive: true });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-say]');
  if (t) { speak([[t.dataset.say, t.dataset.lang || 'he']]); bounce(t); }
});
$('#playBtn').addEventListener('click', () => {
  sfx.init(); sfx.click();
  speak([[S.sel ? `שלום שוב! מי אני היום?` : 'ברוכים הבאים לממלכת המשחקים של טליה ורוני אלבו! מי אני היום?']]);
  show('chars');
});
$('#charGo').addEventListener('click', () => {
  if (!S.sel) { toast('👆 קודם בוחרים דמות!'); speak([['קודם בוחרים דמות!']]); sfx.nope(); shakeEl($('#charGrid')); return; }
  sfx.click(); show('menu');
  speak([[`${curChar().n}! מה נשחק היום?`]]);
});
$('#tbAvatar').addEventListener('click', () => { sfx.click(); hideEnd(); show('chars'); });
$('#menuAvatar').addEventListener('click', () => { sfx.click(); show('chars'); });
$$('.tb-box').forEach(b => b.addEventListener('click', () => tryBox(b.dataset.box, b)));
$('#soundBtn').addEventListener('click', () => {
  S.muted = !S.muted; save(); updateTop();
  if (S.muted) { try { speechSynthesis.cancel(); } catch (e) { } } else { sfx.init(); sfx.click(); }
});
$('#homeBtn').addEventListener('click', () => { sfx.click(); try { speechSynthesis.cancel(); } catch (e) { } show('menu'); });
$('#replayBtn').addEventListener('click', () => { if (G && G.q) { speak(G.q.say); bounce($('#replayBtn')); } });
$('#againBtn').addEventListener('click', () => { const id = G && G.game.id; hideEnd(); sfx.click(); if (id) startGame(id); else show('menu'); });
$('#toMenuBtn').addEventListener('click', () => { hideEnd(); sfx.click(); show('menu'); });
$('#endHint').addEventListener('click', () => {
  hideEnd(); show('menu');
  const type = S.coins >= BOXES.night.price ? 'night' : 'morning';
  setTimeout(() => tryBox(type, $(`#shop [data-box="${type}"]`)), 350);
});
$('#giftBtn').addEventListener('click', openGift);
$('#boxStage').addEventListener('click', tapChest);

TTS.init(); initBg(); initSplash(); updateTop();
</script>
</body>
</html>
