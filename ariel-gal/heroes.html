<style>
:root{

  --ink:#1b1530; --paper:#fffaf0; --sun:#ffd23f; --alarm:#ef233c;
  --font-ui:"Secular One","Varela Round",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle,rgba(255,255,255,.08) 1.6px,transparent 2px) 0 0/14px 14px,var(--ink);color:var(--paper);font-family:var(--font-ui);
  display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
main{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#poster{display:block;width:min(100%,calc((100vh - 120px) * .8),640px);height:auto;aspect-ratio:4/5;border:4px solid var(--ink);border-radius:6px;
  box-shadow:9px 9px 0 #000,0 0 0 3px var(--paper)}

.big{border:3px solid var(--ink);border-radius:14px;background:var(--alarm);color:#fff;padding:12px 18px;font:inherit;font-size:20px;line-height:1.1;
  box-shadow:0 5px 0 #000;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.big.alt{background:var(--paper);color:var(--ink)}
.big:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.big svg{width:20px;height:20px}
#msg{margin:0;min-height:1.3em;font-size:14px;color:#cfc8e6}

(() => {

const K = '#1b1530';
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// Gal's rescue unit: original dogs in the five colors, each with a job and a vehicle
const DOGS = [
  { id: 'red', vehName: 'משאית מנוף', name: 'סולמי', job: 'סולם ומנוף', color: '#e63946', color2: '#9d0208', fur: '#e0a458', fur2: '#a66a2c', ears: 'flop', tool: 'ladder', veh: 'crane',

function drawDog(c, x, y, s, d, o = {}) {

// The villains: naughty raccoons
